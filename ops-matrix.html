<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Matrix</title>
<style>
/* Ops Matrix design system. Everything scoped under .omx - no bare element selectors,
   no !important, no @import. Per-view prefixes: .omx-grid-*, .omx-mob-*, .omx-dash-*, .omx-app-*,
   plus the shared .omx-tone-* / .omx-band-* utilities. */

.omx {
  --omx-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --omx-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --omx-bg:#fff; --omx-surface:#f6f7f9; --omx-border:#d8dce2;
  --omx-text:#14171a; --omx-text-dim:#5b6570; --omx-accent:#2f6fed;
  /* band fills - INDEXED, because band ids are user data. 0 = lowest band */
  --omx-band-0:#d64545; --omx-band-1:#d98324; --omx-band-2:#c9a227;
  --omx-band-3:#2e9e5b; --omx-band-4:#2e9e5b; --omx-band-5:#2e9e5b;
  /* tone grammar - what the views actually use */
  --omx-green:#2e9e5b; --omx-amber:#d98324; --omx-red:#d64545; --omx-none:#9aa4af;
  --omx-target-line:#2f6fed;
  /* code cell fills, keyed by code letter */
  --omx-code-T:#d7f0e0; --omx-code-W:#bfe6cd; --omx-code-C:#f6ddd6;
  --omx-code-B:#e8eaed; --omx-code-blank:transparent;
  /* sync banner states */
  --omx-sync-synced:#2e9e5b; --omx-sync-dirty:#d98324; --omx-sync-syncing:#2f6fed;
  --omx-sync-offline:#5b6570; --omx-sync-token:#d64545; --omx-sync-conflict:#d64545;

  --omx-radius: 6px;
  --omx-gap: 8px;
  --omx-shadow: 0 1px 2px rgba(0,0,0,0.08);

  font-family: var(--omx-font);
  color: var(--omx-text);
  background: var(--omx-bg);
  box-sizing: border-box;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

@media (prefers-color-scheme: dark) {
  .omx {
    --omx-bg:#14171a; --omx-surface:#1d2126;
    --omx-border:#2c323a; --omx-text:#eceff3; --omx-text-dim:#9aa4af;
    /* band+tone hues unchanged */
  }
}

.omx *, .omx *::before, .omx *::after { box-sizing: inherit; }

.omx :where(button, input, select, textarea) {
  font-family: inherit;
  font-size: 14px;
  color: var(--omx-text);
  background: var(--omx-bg);
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  padding: 6px 10px;
}

.omx button {
  cursor: pointer;
  background: var(--omx-surface);
}

.omx button:hover {
  background: var(--omx-border);
}

.omx table {
  border-collapse: collapse;
}

/* ---------------------------------------------------------------------- */
/* Shared tone / band utilities                                           */
/* ---------------------------------------------------------------------- */

.omx-tone-green { color: var(--omx-green); }
.omx-tone-amber { color: var(--omx-amber); }
.omx-tone-red   { color: var(--omx-red); }
.omx-tone-none  { color: var(--omx-none); }

.omx-band-0 { background: var(--omx-band-0); }
.omx-band-1 { background: var(--omx-band-1); }
.omx-band-2 { background: var(--omx-band-2); }
.omx-band-3 { background: var(--omx-band-3); }
.omx-band-4 { background: var(--omx-band-4); }
.omx-band-5 { background: var(--omx-band-5); }

/* ---------------------------------------------------------------------- */
/* Shell: nav, sync banner, view containers                               */
/* ---------------------------------------------------------------------- */

.omx-app-nav {
  display: flex;
  gap: var(--omx-gap);
  padding: 10px 14px;
  border-bottom: 1px solid var(--omx-border);
  background: var(--omx-surface);
  flex-wrap: wrap;
}

.omx-app-nav-btn {
  font-weight: 600;
}

.omx-app-nav-btn[data-active="true"] {
  background: var(--omx-accent);
  color: #fff;
  border-color: var(--omx-accent);
}

.omx-app-sync-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  font-size: 13px;
  border-bottom: 1px solid var(--omx-border);
  color: #fff;
  background: var(--omx-sync-offline);
}

.omx-app-sync-banner[data-state="synced"]           { background: var(--omx-sync-synced); }
.omx-app-sync-banner[data-state="dirty"]             { background: var(--omx-sync-dirty); }
.omx-app-sync-banner[data-state="syncing"]           { background: var(--omx-sync-syncing); }
.omx-app-sync-banner[data-state="offline"]           { background: var(--omx-sync-offline); }
.omx-app-sync-banner[data-state="token-needed"]      { background: var(--omx-sync-token); }
.omx-app-sync-banner[data-state="conflict-retrying"] { background: var(--omx-sync-conflict); }

.omx-app-sync-message { flex: 1 1 auto; }

.omx-app-sync-dirty { font-variant-numeric: tabular-nums; opacity: 0.9; }

.omx-app-sync-token-btn {
  background: rgba(255,255,255,0.18);
  color: #fff;
  border-color: rgba(255,255,255,0.4);
}

.omx-app-main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.omx-app-view-container {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
}

.omx[data-view="grid"] #omx-view-grid,
.omx[data-view="mobile"] #omx-view-mobile,
.omx[data-view="scoreboard"] #omx-view-scoreboard,
.omx[data-view="settings"] #omx-view-settings {
  display: flex;
  flex-direction: column;
}

/* Desktop grid is never mobile-constrained; each view is purpose-built and shares only tokens. */

/* ---------------------------------------------------------------------- */
/* Settings panel                                                         */
/* ---------------------------------------------------------------------- */

.omx-app-settings {
  padding: 16px;
  gap: 24px;
  max-width: 860px;
}

.omx-app-settings-section {
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  padding: 14px 16px;
  background: var(--omx-surface);
}

.omx-app-settings-section h2 {
  margin: 0 0 10px 0;
  font-size: 15px;
}

.omx-app-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
  max-width: 420px;
}

.omx-app-field span {
  font-size: 12px;
  color: var(--omx-text-dim);
}

.omx-app-help-text {
  font-size: 12px;
  color: var(--omx-text-dim);
  max-width: 480px;
}

.omx-app-repeat-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}

.omx-app-repeat-row {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  padding: 6px;
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: var(--omx-bg);
}

.omx-app-export-link {
  display: inline-block;
  padding: 6px 10px;
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: var(--omx-surface);
  color: var(--omx-accent);
  text-decoration: none;
  font-weight: 600;
  margin-bottom: 10px;
}

.omx-app-import-warnings {
  font-size: 12px;
  color: var(--omx-amber);
  white-space: pre-wrap;
}

/* ---------------------------------------------------------------------- */
/* Grid view (desktop, dense)                                             */
/* ---------------------------------------------------------------------- */

.omx-grid-scroll {
  overflow: auto;
  flex: 1 1 auto;
  min-height: 0;
}

.omx-grid-table {
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12px;
  min-width: 100%;
}

.omx-grid-category-header {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--omx-surface);
  padding: 8px 10px;
  font-weight: 700;
  border-bottom: 1px solid var(--omx-border);
  display: flex;
  gap: 14px;
  align-items: baseline;
  flex-wrap: wrap;
}

.omx-grid-category-header .omx-grid-today-score {
  font-size: 16px;
}

.omx-grid-header-row th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--omx-surface);
  border-bottom: 1px solid var(--omx-border);
  padding: 4px 6px;
  font-weight: 600;
  white-space: nowrap;
  text-align: center;
}

.omx-grid-header-row th.omx-grid-op-col {
  position: sticky;
  left: 0;
  z-index: 4;
  text-align: left;
}

.omx-grid-header-row th[data-today="true"] {
  outline: 2px solid var(--omx-target-line);
  outline-offset: -2px;
}

.omx-grid-op-name {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--omx-bg);
  border-right: 1px solid var(--omx-border);
  padding: 4px 8px;
  white-space: nowrap;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.omx-grid-op-name[data-excluded="true"] {
  color: var(--omx-text-dim);
  text-decoration: line-through;
}

.omx-grid-cell {
  border: 1px solid var(--omx-border);
  width: 28px;
  height: 26px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  font-family: var(--omx-mono);
  font-weight: 700;
}

.omx-grid-cell:hover {
  outline: 2px solid var(--omx-accent);
  outline-offset: -2px;
}

.omx-grid-cell[data-code="T"] { background: var(--omx-code-T); }
.omx-grid-cell[data-code="W"] { background: var(--omx-code-W); }
.omx-grid-cell[data-code="C"] { background: var(--omx-code-C); }
.omx-grid-cell[data-code="B"] { background: var(--omx-code-B); }
.omx-grid-cell[data-code=""]  { background: var(--omx-code-blank); }

.omx-grid-trail-list {
  display: flex;
  gap: 10px;
  font-weight: 400;
  font-size: 12px;
  color: var(--omx-text-dim);
}

/* ---------------------------------------------------------------------- */
/* Mobile view (phone, low friction)                                      */
/* ---------------------------------------------------------------------- */

.omx-mob-stepper {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--omx-border);
  background: var(--omx-surface);
  position: sticky;
  top: 0;
}

.omx-mob-stepper button {
  min-width: 44px;
  min-height: 44px;
  font-size: 16px;
}

.omx-mob-date-label {
  flex: 1 1 auto;
  text-align: center;
  font-weight: 700;
}

.omx-mob-progress {
  font-size: 12px;
  color: var(--omx-text-dim);
  padding: 6px 14px;
}

.omx-mob-category {
  padding: 10px 14px;
}

.omx-mob-category-name {
  font-weight: 700;
  margin-bottom: 6px;
}

.omx-mob-op-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  margin-bottom: 6px;
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: var(--omx-bg);
  cursor: pointer;
  text-align: left;
  font-size: 15px;
}

.omx-mob-op-row[data-code="T"] { background: var(--omx-code-T); }
.omx-mob-op-row[data-code="W"] { background: var(--omx-code-W); }
.omx-mob-op-row[data-code="C"] { background: var(--omx-code-C); }
.omx-mob-op-row[data-code="B"] { background: var(--omx-code-B); }
.omx-mob-op-row[data-code=""]  { background: var(--omx-bg); }

.omx-mob-op-name { flex: 1 1 auto; }

.omx-mob-op-code {
  font-family: var(--omx-mono);
  font-weight: 700;
  min-width: 24px;
  text-align: center;
}

/* ---------------------------------------------------------------------- */
/* Scoreboard view (glanceable, one card per category)                    */
/* ---------------------------------------------------------------------- */

.omx-dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  padding: 14px;
}

.omx-dash-card {
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: var(--omx-surface);
  padding: 14px;
  box-shadow: var(--omx-shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.omx-dash-card-title {
  font-weight: 700;
  font-size: 15px;
}

.omx-dash-trails {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
}

.omx-dash-trail {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 80px;
}

.omx-dash-trail-label {
  color: var(--omx-text-dim);
}

.omx-dash-trail-value {
  font-weight: 700;
  font-size: 14px;
}

.omx-dash-today {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.omx-dash-today-value {
  font-size: 28px;
  font-weight: 800;
}

.omx-dash-today-target {
  font-size: 12px;
  color: var(--omx-text-dim);
}

.omx-dash-ladder {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.omx-dash-ladder-day {
  width: 30px;
  height: 30px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
}

.omx-dash-unticked {
  font-size: 12px;
  color: var(--omx-text-dim);
}

.omx-dash-unticked-list {
  margin: 4px 0 0 0;
  padding-left: 16px;
}

.omx-dash-overall {
  padding: 14px;
  border-bottom: 1px solid var(--omx-border);
  display: flex;
  gap: 20px;
  align-items: baseline;
  flex-wrap: wrap;
}

.omx-dash-overall-score {
  font-size: 22px;
  font-weight: 800;
}
</style>
</head>
<body>
<div id="omx-app" class="omx" data-viewmode="auto" data-view="grid">

  <nav id="omx-nav" class="omx-app-nav">
    <button type="button" class="omx-app-nav-btn" data-view-btn="grid">Grid</button>
    <button type="button" class="omx-app-nav-btn" data-view-btn="mobile">Mobile</button>
    <button type="button" class="omx-app-nav-btn" data-view-btn="scoreboard">Scoreboard</button>
    <button type="button" class="omx-app-nav-btn" data-view-btn="settings">Settings</button>
  </nav>

  <div id="omx-sync-banner" class="omx-app-sync-banner" data-state="offline">
    <span class="omx-app-sync-message"></span>
    <span class="omx-app-sync-dirty"></span>
    <button type="button" class="omx-app-sync-token-btn" hidden>Go to Settings</button>
  </div>

  <main class="omx-app-main">
    <div id="omx-view-grid" class="omx-app-view-container"></div>
    <div id="omx-view-mobile" class="omx-app-view-container" hidden></div>
    <div id="omx-view-scoreboard" class="omx-app-view-container" hidden></div>

    <div id="omx-view-settings" class="omx-app-view-container omx-app-settings" hidden>

      <section class="omx-app-settings-section" data-settings-section="connection">
        <h2>Connection</h2>
        <label class="omx-app-field">
          <span>Personal access token</span>
          <input type="password" id="omx-app-pat" autocomplete="off" spellcheck="false">
        </label>
        <button type="button" id="omx-app-pat-save">Save token</button>
        <button type="button" id="omx-app-pat-test">Test</button>
        <label class="omx-app-field">
          <span>Repo owner</span>
          <input type="text" id="omx-app-repo-owner" data-config-path="__local.repo.owner">
        </label>
        <label class="omx-app-field">
          <span>Repo name</span>
          <input type="text" id="omx-app-repo-name" data-config-path="__local.repo.name">
        </label>
        <label class="omx-app-field">
          <span>File path</span>
          <input type="text" id="omx-app-repo-path" data-config-path="__local.repo.path">
        </label>
        <label class="omx-app-field">
          <span>Branch</span>
          <input type="text" id="omx-app-repo-branch" data-config-path="__local.repo.branch">
        </label>
        <p class="omx-app-help-text">
          Fine-grained PAT with Contents read/write on this one repo. Stored in this browser only,
          never committed.
        </p>
      </section>

      <section class="omx-app-settings-section" data-settings-section="scoring">
        <h2>Scoring</h2>
        <label class="omx-app-field">
          <span>Target %</span>
          <input type="number" min="0" max="100" id="omx-app-target"
                 data-config-path="settings.scoring.target">
        </label>
        <div id="omx-app-bands" class="omx-app-repeat-list"></div>
        <button type="button" id="omx-app-band-add">Add band</button>
      </section>

      <section class="omx-app-settings-section" data-settings-section="trails">
        <h2>Trails</h2>
        <div id="omx-app-trails" class="omx-app-repeat-list"></div>
      </section>

      <section class="omx-app-settings-section" data-settings-section="codes">
        <h2>Codes</h2>
        <div id="omx-app-codes" class="omx-app-repeat-list"></div>
        <button type="button" id="omx-app-code-add">Add code</button>
      </section>

      <section class="omx-app-settings-section" data-settings-section="categories">
        <h2>Categories and items</h2>
        <div id="omx-app-categories" class="omx-app-repeat-list"></div>
        <button type="button" id="omx-app-category-add">Add category</button>
      </section>

      <section class="omx-app-settings-section" data-settings-section="display">
        <h2>Display</h2>
        <label class="omx-app-field">
          <span>Timezone (IANA)</span>
          <input type="text" id="omx-app-timezone" data-config-path="settings.timezone">
        </label>
        <label class="omx-app-field">
          <span>Date format</span>
          <input type="text" id="omx-app-date-format" data-config-path="settings.dateFormat">
        </label>
        <label class="omx-app-field">
          <span>Dashboard last N days</span>
          <input type="number" min="1" id="omx-app-last-n-days"
                 data-config-path="settings.dashboard.lastNDays">
        </label>
        <label class="omx-app-field">
          <span>Grid days</span>
          <input type="number" min="1" id="omx-app-grid-days" data-config-path="__local.grid.days">
        </label>
        <label class="omx-app-field">
          <span>View mode</span>
          <select id="omx-app-viewmode" data-config-path="__local.viewmode">
            <option value="auto">Auto</option>
            <option value="desktop">Desktop</option>
            <option value="mobile">Mobile</option>
          </select>
        </label>
      </section>

      <section class="omx-app-settings-section" data-settings-section="data">
        <h2>Data</h2>
        <a id="omx-app-export" download class="omx-app-export-link">Export JSON</a>
        <label class="omx-app-field">
          <span>Import JSON</span>
          <input type="file" id="omx-app-import" accept="application/json,.json">
        </label>
        <div id="omx-app-import-warnings" class="omx-app-import-warnings"></div>
      </section>

    </div>
  </main>

</div>

<script>window.OpsMatrix = window.OpsMatrix || { views: {}, storage: {}, util: {} };</script>
<script>
/*
 * Ops Matrix calculation engine.
 *
 * Implements scripts/ops-matrix/spec/engine-spec.md and engine-spec.json, spec version
 * 1.0.0_2026-08-18_1349. Pure functions over one JSON document; no derived value is ever
 * stored, no clock is ever read, no number that affects output is a literal in this file
 * (every one of them is reachable from settings).
 *
 * Loadable two ways:
 *   node     - `var Engine = require('./engine.js');`
 *   browser  - plain concatenation; the file declares one global `Engine`.
 * It requires nothing at all, project file or otherwise.
 */

var Engine = (function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Constants that are NOT scoring numbers. None of these changes any score.
  // ---------------------------------------------------------------------------

  var SPEC_VERSION = '1.0.0_2026-08-18_1349';
  var SCHEMA_VERSION = 1;

  // Q15: the workbook item-header range starts one column before the first named item,
  // so the first item sits at offset 1. Stable and arbitrary; fixed here forever so that
  // re-running migration is a no-op.
  var SLOT_INDEX_BASE = 1;

  var NULL_REASON = {
    INSUFFICIENT_HISTORY: 'insufficient-history',
    NO_SCORABLE_DAYS: 'no-scorable-days',
    NO_ACTIVE_OPS: 'no-active-ops'
  };

  var WARN = {
    UNKNOWN_CODE: 'unknown-code',
    LEGACY_CODE_REWRITTEN: 'legacy-code-rewritten',
    DUPLICATE_ENTRY: 'duplicate-entry',
    ENTRY_BEFORE_START: 'entry-before-start',
    ENTRY_UNKNOWN_OP: 'entry-unknown-op',
    CATEGORY_NO_OPS: 'category-no-ops',
    OPCOUNT_MISMATCH: 'opcount-mismatch',
    MISSING_TIMEZONE: 'missing-timezone',
    MISSING_START: 'missing-started-on',
    DUPLICATE_OP_NAME: 'duplicate-op-name',
    SLOT_UNKNOWN_OP: 'slot-unknown-op'
  };

  // The shipped settings. Data, not code: a host may replace any of it.
  // See defaultSettingsNotes in engine-spec.json for which values are observed and which
  // are product decisions.
  var DEFAULT_SETTINGS = {
    timezone: 'Australia/Sydney',
    dateFormat: 'dd/MM/yyyy',
    codes: {
      'T': { label: 'Tick', num: 1, den: 1, counterLabel: 'Tick/Track Count', satisfiesEngagement: true },
      'W': { label: 'Winning', num: 1, den: 1, counterLabel: 'Winning Count', satisfiesEngagement: true },

      if (opts.attrs) {
        for (var k in opts.attrs) {

    var titleRow = el("div", { className: "omx-grid-cat-title-row" });
    var name = el("span", { className: "omx-grid-cat-name", text: cat.name });
    titleRow.appendChild(name);

    var today = el("span", {
      className: "omx-grid-cat-today omx-tone-" + cat.today.tone,
      text: "Today " + cat.today.display
    });
    titleRow.appendChild(today);
    header.appendChild(titleRow);

    var trailsRow = el("div", { className: "omx-grid-cat-trails" });
    for (var i = 0; i < cat.trails.length; i++) {
      var trail = cat.trails[i];
      if (!trail.showOnDashboard) continue;
      var chip = el("span", {
        className: "omx-grid-trail-chip omx-tone-" + trail.tone,
        text: trail.label + ": " + trail.display

      trailsRow.appendChild(chip);
    }
    header.appendChild(trailsRow);

  function buildTable(cat, derived, handlers) {
    var table = el("table", {

    });

    var thead = el("thead");
    var headRow = el("tr");
    var corner = el("th", { className: "omx-grid-corner-cell" });
    headRow.appendChild(corner);

    for (var d = 0; d < derived.dateAxis.length; d++) {
      var day = derived.dateAxis[d];
      var classes = "omx-grid-date-cell";
      if (day.isToday) classes += " omx-grid-date-today";
      if (day.isWeekend) classes += " omx-grid-date-weekend";
      var th = el("th", { className: classes, attrs: { "data-date": day.d, scope: "col" } });
      var dow = el("span", { className: "omx-grid-date-dow", text: day.dow });
      var lbl = el("span", { className: "omx-grid-date-label", text: day.label });
      th.appendChild(dow);
      th.appendChild(lbl);
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = el("tbody");
    for (var o = 0; o < cat.ops.length; o++) {
      var op = cat.ops[o];
      var tr = el("tr", { attrs: { "data-op-id": op.id } });

      var opCell = el("th", {

      });

      if (op.target) {
        var target = el("span", { className: "omx-grid-op-target", text: op.target });
        opCell.appendChild(target);
      }
      tr.appendChild(opCell);

      for (var dd = 0; dd < derived.dateAxis.length; dd++) {
        var dayCol = derived.dateAxis[dd];
        var key = op.id + "|" + dayCol.d;
        var code = cat.cells[key];
        var td = el("td", { className: "omx-grid-cell-wrap" });
        var cellClasses = "omx-grid-cell";
        if (dayCol.isToday) cellClasses += " omx-grid-cell-today";
        var btn = el("button", {
          className: cellClasses,
          text: code ? code : "",
          attrs: {
            type: "button",
            "data-code": code ? code : "",

        });
        btn.addEventListener("click", (function (opId, dateIso) {
          return function () {

      var target = evt.target;
      if (!target || !target.classList || !target.classList.contains("omx-grid-cell")) return;

      if (key !== "ArrowLeft" && key !== "ArrowRight" && key !== "ArrowUp" && key !== "ArrowDown") return;
      evt.preventDefault();
      var td = target.parentElement;
      var tr = td.parentElement;
      var cellIndex = Array.prototype.indexOf.call(tr.children, td);
      var focusTarget = null;

      if (key === "ArrowLeft") {
        var prevTd = td.previousElementSibling;
        if (prevTd) focusTarget = prevTd.querySelector(".omx-grid-cell");
      } else if (key === "ArrowRight") {
        var nextTd = td.nextElementSibling;
        if (nextTd) focusTarget = nextTd.querySelector(".omx-grid-cell");
      } else if (key === "ArrowUp") {
        var prevTr = tr.previousElementSibling;
        if (prevTr && prevTr.children[cellIndex]) {
          focusTarget = prevTr.children[cellIndex].querySelector(".omx-grid-cell");
        }

        var nextTr = tr.nextElementSibling;
        if (nextTr && nextTr.children[cellIndex]) {
          focusTarget = nextTr.children[cellIndex].querySelector(".omx-grid-cell");

      root.appendChild(section);
    }

    container.appendChild(root);
  }

  window.OpsMatrix.views.grid = { render: render };
})();

<script>
window.OpsMatrix = window.OpsMatrix || { views: {}, storage: {}, util: {} };

(function () {
  "use strict";

  function findCurrentDate(model, derived) {
    var d = null;
    if (model) {
      d = model.mobileDate || model.selectedDate || model.focusedDate || null;
    }
    return d || derived.todayIso;
  }

  function findAxisIndex(dateAxis, dateIso) {
    for (var i = 0; i < dateAxis.length; i++) {
      if (dateAxis[i].d === dateIso) return i;
    }
    return -1;
  }

  function findCode(codes, key) {
    if (!key) return null;
    for (var i = 0; i < codes.length; i++) {
      if (codes[i].key === key) return codes[i];
    }
    return null;
  }

  function render(container, model, derived, handlers) {
    container.textContent = "";

    var currentDate = findCurrentDate(model, derived);
    var dateAxis = derived.dateAxis || [];
    var idx = findAxisIndex(dateAxis, currentDate);
    var currentEntry = idx >= 0 ? dateAxis[idx] : null;
    var prevEntry = idx > 0 ? dateAxis[idx - 1] : null;
    var nextEntry = idx >= 0 && idx < dateAxis.length - 1 ? dateAxis[idx + 1] : null;

    var stepper = document.createElement("div");
    stepper.className = "omx-mob-stepper";

    var prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.className = "omx-mob-step-btn omx-mob-step-prev";
    prevBtn.textContent = "‹ Prev";
    if (!prevEntry) prevBtn.disabled = true;
    prevBtn.addEventListener("click", function () {
      if (prevEntry) handlers.onDateChange(prevEntry.d);
    });
    stepper.appendChild(prevBtn);

    var dateLabel = document.createElement("div");
    dateLabel.className = "omx-mob-step-date";
    dateLabel.textContent = currentEntry
      ? currentEntry.dow + " " + currentEntry.label
      : currentDate;
    stepper.appendChild(dateLabel);

    var todayBtn = document.createElement("button");
    todayBtn.type = "button";
    todayBtn.className = "omx-mob-step-today";
    todayBtn.textContent = "Today";
    if (currentDate === derived.todayIso) todayBtn.disabled = true;
    todayBtn.addEventListener("click", function () {
      handlers.onDateChange(derived.todayIso);
    });
    stepper.appendChild(todayBtn);

    var nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "omx-mob-step-btn omx-mob-step-next";
    nextBtn.textContent = "Next ›";
    if (!nextEntry) nextBtn.disabled = true;
    nextBtn.addEventListener("click", function () {
      if (nextEntry) handlers.onDateChange(nextEntry.d);
    });
    stepper.appendChild(nextBtn);

    container.appendChild(stepper);

    var categories = derived.categories || [];
    var totalOps = 0;
    var doneOps = 0;
    categories.forEach(function (cat) {
      (cat.ops || []).forEach(function (op) {
        totalOps += 1;
        var key = op.id + "|" + currentDate;
        var code = cat.cells ? cat.cells[key] : undefined;
        if (code) doneOps += 1;
      });
    });

    var counter = document.createElement("div");
    counter.className = "omx-mob-counter";
    counter.textContent = doneOps + " of " + totalOps + " done";
    container.appendChild(counter);

    var list = document.createElement("div");
    list.className = "omx-mob-list";

    categories.forEach(function (cat) {
      var section = document.createElement("section");
      section.className = "omx-mob-cat";

      var header = document.createElement("div");
      header.className = "omx-mob-cat-header";

      var nameEl = document.createElement("span");
      nameEl.className = "omx-mob-cat-name";
      nameEl.textContent = cat.name;
      header.appendChild(nameEl);

      var scoreTone = cat.today ? cat.today.tone : "none";
      var scoreEl = document.createElement("span");
      scoreEl.className = "omx-mob-cat-score omx-tone-" + scoreTone;
      scoreEl.textContent = cat.today ? cat.today.display : "--";
      header.appendChild(scoreEl);

      section.appendChild(header);

      var ops = cat.ops || [];
      ops.forEach(function (op) {
        var key = op.id + "|" + currentDate;
        var code = cat.cells ? cat.cells[key] : undefined;
        var codeInfo = findCode(derived.codes, code);

        var row = document.createElement("button");
        row.type = "button";
        row.className = "omx-mob-op-row";
        if (code) {
          row.classList.add("omx-mob-op-row-ticked");
        }

        var nameSpan = document.createElement("span");
        nameSpan.className = "omx-mob-op-name";
        nameSpan.textContent = op.name;
        row.appendChild(nameSpan);

        var codeSpan = document.createElement("span");
        codeSpan.className = "omx-mob-op-code";
        codeSpan.textContent = codeInfo ? codeInfo.label : "Tap to tick";
        row.appendChild(codeSpan);

        row.addEventListener("click", function () {
          handlers.onTick(op.id, currentDate);
        });

        section.appendChild(row);
      });

      list.appendChild(section);
    });

    container.appendChild(list);
  }

  window.OpsMatrix.views.mobile = { render: render };
})();
</script>

(function () {
  "use strict";

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function toneClass(prefix, tone) {
    return prefix + " omx-tone-" + (tone || "none");
  }

  function renderTrailRow(trail) {
    var row = el("div", "omx-dash-trail-row");
    row.appendChild(el("span", "omx-dash-trail-label", trail.label));
    row.appendChild(el("span", toneClass("omx-dash-trail-value", trail.tone), trail.display));
    return row;
  }

  function renderTrails(category) {
    var wrap = el("div", "omx-dash-trails");
    var trails = category.trails || [];
    for (var i = 0; i < trails.length; i++) {
      if (!trails[i].showOnDashboard) continue;
      wrap.appendChild(renderTrailRow(trails[i]));
    }
    return wrap;
  }

  function renderToday(category) {
    var wrap = el("div", "omx-dash-today");
    wrap.appendChild(el("span", "omx-dash-today-label", "Today"));
    wrap.appendChild(el("span", toneClass("omx-dash-today-value", category.today.tone), category.today.display));
    return wrap;
  }

  function renderLadder(category) {
    var wrap = el("div", "omx-dash-ladder");
    var ladder = category.ladder || [];
    for (var i = 0; i < ladder.length; i++) {
      var d = ladder[i];
      var item = el("div", toneClass("omx-dash-ladder-day", d.tone));
      item.appendChild(el("span", "omx-dash-ladder-date", d.label));
      item.appendChild(el("span", "omx-dash-ladder-score", d.display));
      wrap.appendChild(item);
    }
    return wrap;
  }

  function renderUnticked(category) {
    var wrap = el("div", "omx-dash-unticked");
    var unticked = category.unticked || [];
    wrap.appendChild(el("div", "omx-dash-unticked-title", "Unticked today (" + unticked.length + ")"));
    if (unticked.length === 0) {
      wrap.appendChild(el("div", "omx-dash-unticked-empty", "All done"));
      return wrap;
    }
    var list = el("ul", "omx-dash-unticked-list");
    for (var i = 0; i < unticked.length; i++) {
      var li = el("li", "omx-dash-unticked-item", unticked[i].name);
      list.appendChild(li);
    }
    wrap.appendChild(list);
    return wrap;
  }

  function renderCard(category) {
    var card = el("section", "omx-dash-card");
    var header = el("div", "omx-dash-card-header");
    header.appendChild(el("h3", "omx-dash-card-name", category.name));
    header.appendChild(el("span", "omx-dash-card-count", category.opCount + " ops"));
    card.appendChild(header);

    // Row order contract: trail averages, then today, then the ladder.
    card.appendChild(renderTrails(category));
    card.appendChild(renderToday(category));
    card.appendChild(renderLadder(category));
    card.appendChild(renderUnticked(category));

    return card;
  }

  function renderOverall(derived) {
    var overall = derived.overall;
    var wrap = el("div", "omx-dash-overall");
    wrap.appendChild(el("span", toneClass("omx-dash-overall-score", overall.tone), overall.display));
    wrap.appendChild(el("span", "omx-dash-overall-target", "Target " + derived.targetLabel));
    wrap.appendChild(el(
      "span",
      "omx-dash-overall-categories",
      overall.categoriesOnTarget + " / " + overall.categoriesTotal + " categories on target"
    ));
    if (overall.untickedCount > 0) {
      wrap.appendChild(el("span", "omx-dash-overall-unticked", overall.untickedCount + " unticked"));
    }
    return wrap;
  }

  function render(container, model, derived, handlers) {
    container.textContent = "";

    var root = el("div", "omx-dash-root");
    root.appendChild(el("div", "omx-dash-today-label-top", derived.todayLabel));
    root.appendChild(renderOverall(derived));

    var grid = el("div", "omx-dash-grid");
    var categories = derived.categories || [];
    for (var i = 0; i < categories.length; i++) {
      grid.appendChild(renderCard(categories[i]));
    }
    root.appendChild(grid);

    container.appendChild(root);
  }

  window.OpsMatrix.views.scoreboard = { render: render };
})();

  // -----------------------------------------------------------------------
  // Sync banner
  // -----------------------------------------------------------------------

  function setSync(nextState, message) {
    state.sync.state = nextState;
    state.sync.message = message || SYNC_MESSAGES[nextState] || nextState;
    paintBanner();
  }

  function paintBanner() {
    var banner = byId("omx-sync-banner");
    if (!banner) return;
    banner.setAttribute("data-state", state.sync.state);
    var msg = banner.querySelector(".omx-app-sync-message");
    if (msg) msg.textContent = state.sync.message;
    var dirty = banner.querySelector(".omx-app-sync-dirty");
    var count = state.queue.length + (state.configDirty ? 1 : 0);
    if (dirty) dirty.textContent = count > 0 ? String(count) + " pending" : "";
    var btn = banner.querySelector(".omx-app-sync-token-btn");
    if (btn) btn.hidden = state.sync.state !== "token-needed";
  }

  function reportError(e) {
    var code = e && e.code;
    var msg = (e && e.message) || String(e);
    state.lastError = msg;
    if (code === ERR.NO_TOKEN || code === ERR.BAD_TOKEN) {
      setSync("token-needed", code === ERR.BAD_TOKEN ? "Token rejected by GitHub" : SYNC_MESSAGES["token-needed"]);
    } else if (code === ERR.NETWORK) {
      setSync("offline", SYNC_MESSAGES.offline);
    } else if (code === ERR.RATE_LIMIT) {
      setSync("offline", "GitHub rate limit - retrying later");
    } else if (code === ERR.CONFLICT) {
      setSync("conflict-retrying", "Remote changed - merging and retrying");
      if (state.conflictTimer) clearTimeout(state.conflictTimer);
      state.conflictTimer = setTimeout(function () {
        state.conflictTimer = null;
        if (state.queue.length || state.configDirty) {
          setSync("dirty", SYNC_MESSAGES.dirty);
          scheduleFlush(0);
        } else {
          setSync("synced", SYNC_MESSAGES.synced);
        }
        render();
      }, DEFAULTS.conflictRetryMs);
    } else if (code === ERR.QUOTA) {
      setSync("offline", "This device is out of storage");
    } else if (code === ERR.NOT_FOUND) {
      setSync("dirty", "Data file not created yet - it will be written on the next save");
    } else if (code === ERR.PARSE) {
      setSync("offline", "Stored data could not be read");
    } else {
      setSync("offline", msg);
    }
  }

        setSync("token-needed", SYNC_MESSAGES["token-needed"]);
      }
      return res;
    });
  }

  function persistDocLocally() {
    if (!state.doc) return;
    if (!lsSet(KEYS.DOC, JSON.stringify(state.doc))) {
      setSync("offline", "This device is out of storage");
    }
  }

  function persistQueue() {
    lsSet(KEYS.QUEUE, JSON.stringify(state.queue));
  }

  function loadQueue() {
    try {
      var raw = lsGet(KEYS.QUEUE, "[]");
      var parsed = JSON.parse(raw);
      state.queue = Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      state.queue = [];
    }
  }

  function cachedDoc() {
    try {
      var raw = lsGet(KEYS.DOC, "");
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return isObj(parsed) ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  function adoptDoc(raw) {
    var incoming = raw || cachedDoc() || defaultDoc();
    var result = engineCall(function () { return OM.engine.migrate(incoming); }, null);
    state.doc = result ? result.doc : incoming;
    if (state.queue.length) applyChangesToDoc(state.doc, state.queue);
    persistDocLocally();
    // A device-local adapter has no remote to learn the document from, so hand it the whole
    // thing; otherwise its first writeEntry would build a document out of ticks alone.
    if (state.adapter && state.adapterKind !== "github") {
      try {
        var handoff = state.adapter.bulkImport(state.doc);
        if (handoff && typeof handoff.then === "function") {
          handoff.then(null, function (e) { reportError(e); });
        }
      } catch (e) {
        reportError(e);
      }
    }
  }

  function pull() {
    if (!state.adapter) return Promise.resolve();
    setSync("syncing", SYNC_MESSAGES.syncing);
    render();
    return state.adapter.readAll().then(function (res) {
      var hadRemoteDoc = !!(res && res.doc);
      adoptDoc(res && res.doc);
      // First run against an empty data repo: the seed we just adopted has never been
      // committed, so mark it dirty and let the normal flush write it.
      if (!hadRemoteDoc && res && res.meta && res.meta.source === "github") state.configDirty = true;
      state.lastSyncIso = (res && res.meta && res.meta.fetchedAt) || new Date().toISOString();
      if (state.queue.length || state.configDirty) {
        setSync("dirty", SYNC_MESSAGES.dirty);
        scheduleFlush(DEFAULTS.debounceMs);
      } else if (state.adapterKind === "github") {
        setSync("synced", SYNC_MESSAGES.synced);
      } else if (chooseKind() === "local" && !lsGet(KEYS.PAT, "")) {
        setSync("token-needed", SYNC_MESSAGES["token-needed"]);
      } else {
        setSync("synced", SYNC_MESSAGES.synced);
      }
      render();
      return res;
    }, function (e) {
      if (!state.doc) adoptDoc(null);
      reportError(e);
      render();
    });
  }

  function scheduleFlush(delayMs) {
    if (state.flushTimer) clearTimeout(state.flushTimer);
    state.flushTimer = setTimeout(function () {
      state.flushTimer = null;
      flush();
    }, delayMs === undefined ? DEFAULTS.debounceMs : delayMs);
  }

  // ONE commit per flush: the whole batched queue goes through a single writeEntry call.
  function flush() {
    if (!state.adapter) return Promise.resolve();
    if (state.flushing) { scheduleFlush(250); return Promise.resolve(); }
    if (!state.queue.length && !state.configDirty) return Promise.resolve();

    var batch = state.queue.slice();
    var wantsConfig = state.configDirty;
    state.flushing = true;
    setSync("syncing", SYNC_MESSAGES.syncing);
    render();

    var work;
    if (wantsConfig) {
      work = state.adapter.writeConfig(state.doc).then(function () {
        state.configDirty = false;
        if (batch.length) return state.adapter.writeEntry(batch);
        return null;
      });
    } else {
      work = state.adapter.writeEntry(batch);
    }

    return work.then(function (res) {
      state.flushing = false;
      var flushed = {};
      for (var i = 0; i < batch.length; i++) flushed[batch[i].d + "|" + batch[i].op] = true;
      state.queue = state.queue.filter(function (ch) { return !flushed[ch.d + "|" + ch.op]; });
      persistQueue();
      state.lastSyncIso = (res && res.meta && res.meta.fetchedAt) || new Date().toISOString();
      if (state.queue.length || state.configDirty) {
        setSync("dirty", SYNC_MESSAGES.dirty);
        scheduleFlush(DEFAULTS.debounceMs);
      } else {
        setSync("synced", SYNC_MESSAGES.synced);
      }
      render();
    }, function (e) {
      state.flushing = false;
      reportError(e);
      render();
    });
  }

  // -----------------------------------------------------------------------
  // Config path writes
  // -----------------------------------------------------------------------

  function parsePath(path) {
    var parts = [];
    var re = /\["([^"]*)"\]|\[(\d+)\]|([^.[\]]+)/g;
    var m;
    while ((m = re.exec(path)) !== null) {
      if (m[1] !== undefined) parts.push({ k: m[1], quoted: true });
      else if (m[2] !== undefined) parts.push({ k: Number(m[2]), quoted: false });
      else parts.push({ k: m[3], quoted: false });
    }
    return parts;
  }

  function setPath(root, path, value) {
    var parts = parsePath(path);
    if (!parts.length) return false;
    var node = root;
    for (var i = 0; i < parts.length - 1; i++) {
      var k = parts[i].k;
      if (node === null || node === undefined) return false;
      if (node[k] === undefined || node[k] === null) node[k] = {};
      node = node[k];
    }
    var leaf = parts[parts.length - 1].k;
    if (leaf === "__key") {
      // rename the map key that holds this node (used by the code editor)
      return false;
    }
    node[leaf] = value;
    return true;
  }

  function applyLocalConfig(path, value) {
    if (path === "__local.repo.owner") { lsSet(KEYS.REPO_OWNER, String(value)); return "reinit"; }
    if (path === "__local.repo.name") { lsSet(KEYS.REPO_NAME, String(value)); return "reinit"; }
    if (path === "__local.repo.path") { lsSet(KEYS.REPO_PATH, String(value)); return "reinit"; }
    if (path === "__local.repo.branch") { lsSet(KEYS.REPO_BRANCH, String(value)); return "reinit"; }
    if (path === "__local.grid.days") {
      var n = Math.max(1, Math.trunc(Number(value) || DEFAULTS.gridDays));
      state.gridDays = n;
      lsSet(KEYS.GRID_DAYS, String(n));
      return "render";
    }
    if (path === "__local.viewmode") {
      state.viewMode = String(value);
      lsSet(KEYS.VIEWMODE, state.viewMode);
      applyViewMode();
      return "render";
    }
    return null;
  }

  function renameCode(oldKey, newKey) {
    if (!newKey || newKey === oldKey) return;
    var codes = state.doc.settings.codes;
    if (!codes || !hasOwn(codes, oldKey) || hasOwn(codes, newKey)) return;
    var rebuilt = {}, k;
    for (k in codes) {
      if (!hasOwn(codes, k)) continue;
      rebuilt[k === oldKey ? newKey : k] = codes[k];
    }
    state.doc.settings.codes = rebuilt;
    var entries = state.doc.entries || [];
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].c === oldKey) entries[i].c = newKey;
    }
    markConfigDirty();
  }

  function markConfigDirty() {
    state.configDirty = true;
    persistDocLocally();
    setSync("dirty", SYNC_MESSAGES.dirty);
    scheduleFlush(DEFAULTS.debounceMs);
  }

  // -----------------------------------------------------------------------
  // Handlers - the exact contract the views call
  // -----------------------------------------------------------------------

  function nextInCycle(cycle, current) {
    var cur = current === undefined ? null : current;
    var idx = cycle.indexOf(cur);
    if (idx === -1) return cycle.length ? cycle[0] : null;
    return cycle[(idx + 1) % cycle.length];
  }

  var handlers = {
    onTick: function (opId, dateISO, nextCode) {
      if (!state.doc) return;
      var settings = state.doc.settings || {};
      var cycle = codeRows(settings).map(function (c) { return c.key; });
      cycle.push(null);
      var current = codeAt(state.doc, opId, dateISO);
      var code = nextCode === undefined ? nextInCycle(cycle, current) : nextCode;
      var change = { d: dateISO, op: opId, c: code === undefined ? null : code };

      applyChangesToDoc(state.doc, [change]);
      persistDocLocally();

      state.queue = state.queue.filter(function (ch) {
        return !(ch.d === change.d && ch.op === change.op);
      });
      state.queue.push(change);
      persistQueue();

      setSync("dirty", SYNC_MESSAGES.dirty);
      scheduleFlush(DEFAULTS.debounceMs);
      render();
    },

    onConfigChange: function (path, value) {
      if (typeof path !== "string") return;
      var local = applyLocalConfig(path, value);
      if (local === "reinit") {
        initStorage().then(pull);
        return;
      }
      if (local === "render") { render(); return; }
      if (!state.doc) return;
      if (setPath(state.doc, path, value)) {
        markConfigDirty();
        render();
      }
    },

    onImport: function (file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try {
          parsed = JSON.parse(String(reader.result));
        } catch (e) {
          state.importWarnings = [{ code: "parse", message: "That file is not valid JSON." }];
          render();
          return;
        }
        var result = engineCall(function () { return OM.engine.migrate(parsed); }, null);
        if (!result) return;
        state.importWarnings = result.warnings || [];
        state.doc = result.doc;
        state.queue = [];
        persistQueue();
        persistDocLocally();
        setSync("syncing", SYNC_MESSAGES.syncing);
        render();
        state.adapter.bulkImport(state.doc).then(function () {
          setSync("synced", SYNC_MESSAGES.synced);
          render();
        }, function (e) {
          reportError(e);
          render();
        });
      };
      reader.onerror = function () {
        state.importWarnings = [{ code: "read", message: "That file could not be read." }];
        render();
      };
      reader.readAsText(file);
    },

    onExport: function () {
      var link = byId("omx-app-export");
      if (!link || !state.adapter) return;
      state.adapter.exportJson().then(function (json) {
        var payload = json && json !== "null" ? json : JSON.stringify(state.doc, null, 2);
        if (state.exportUrl) {
          try { URL.revokeObjectURL(state.exportUrl); } catch (e) { /* ignore */ }
        }
        state.exportUrl = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
        link.href = state.exportUrl;
        link.download = "ops-matrix-" + todayIso() + ".json";
        state.exportPrimed = true;
        link.click();
        state.exportPrimed = false;
      });
    },

    onPatSave: function (token) {
      var t = String(token || "").trim();
      if (t) lsSet(KEYS.PAT, t); else lsRemove(KEYS.PAT);
      initStorage().then(function () {
        return pull();
      });
    },

    onPatTest: function () {
      if (!state.adapter) return;
      setSync("syncing", "Testing the connection");
      render();
      state.adapter.readAll().then(function (res) {
        if (res && res.meta && res.meta.source === "github") {
          setSync("synced", "Token works - connected to the data repo");
        } else {
          setSync("token-needed", "No remote connection - check the token and repo fields");
        }
        render();
      }, function (e) {
        reportError(e);
        render();
      });
    },

    onViewSwitch: function (name) {
      if (["grid", "mobile", "scoreboard", "settings"].indexOf(name) === -1) return;
      state.view = name;
      lsSet(KEYS.VIEW, name);
      render();
    },

    onDateChange: function (dateISO) {
      state.mobileDate = dateISO;
      render();
    },

    onSyncNow: function () {
      pull().then(function () { return flush(); });
    },

    onAddOp: function (categoryId, name) {
      if (!state.doc || !name) return;
      var cats = state.doc.categories || [];
      for (var i = 0; i < cats.length; i++) {
        if (cats[i].id !== categoryId) continue;
        var slots = cats[i].slots || (cats[i].slots = []);
        var opId = categoryId + ":" + slots.length;
        var guard = 0;
        while (opsById(state.doc)[opId] && guard < 1000) {
          guard += 1;
          opId = categoryId + ":" + (slots.length + guard);
        }
        state.doc.ops.push({ id: opId, name: String(name), excluded: false });
        slots.push(opId);
        markConfigDirty();
        render();
        return;
      }
    },

    onAddCategory: function (name, startedOnISO) {
      if (!state.doc || !name) return;
      var base = String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      if (!base) base = "category";
      var id = base, guard = 1;
      var cats = state.doc.categories || (state.doc.categories = []);
      var taken = {};
      for (var i = 0; i < cats.length; i++) taken[cats[i].id] = true;
      while (taken[id] && guard < 1000) { id = base + "-" + guard; guard += 1; }
      cats.push({
        id: id,
        name: String(name),
        startedOn: startedOnISO || todayIso(),
        slots: [],
        order: cats.length + 1
      });
      markConfigDirty();
      render();
    }
  };

  // -----------------------------------------------------------------------
  // Settings panel (app.js owns it; it is not a view module)
  // -----------------------------------------------------------------------

  function field(labelText, input) {
    var wrap = el("label", "omx-app-field");
    wrap.appendChild(el("span", null, labelText));
    wrap.appendChild(input);
    return wrap;
  }

  function textInput(value, onChange, type) {
    var input = document.createElement("input");
    input.type = type || "text";
    input.value = value === undefined || value === null ? "" : String(value);
    input.addEventListener("change", function () { onChange(input.value); });
    return input;
  }

  function numberInput(value, onChange) {
    var input = document.createElement("input");
    input.type = "number";
    input.value = isNum(value) ? String(value) : "";
    input.addEventListener("change", function () { onChange(Number(input.value)); });
    return input;
  }

  function checkboxInput(checked, onChange) {
    var input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!checked;
    input.addEventListener("change", function () { onChange(input.checked); });
    return input;
  }

  function button(text, onClick, className) {
    var b = el("button", className || null, text);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  }

  function renderBands() {
    var host = byId("omx-app-bands");
    if (!host) return;
    host.textContent = "";
    var bands = (state.doc.settings.scoring && state.doc.settings.scoring.bands) || [];
    bands.forEach(function (b, i) {
      var row = el("div", "omx-app-repeat-row");
      row.appendChild(field("Id", textInput(b.id, function (v) {
        handlers.onConfigChange("settings.scoring.bands[" + i + "].id", v);
      })));
      row.appendChild(field("Label", textInput(b.label, function (v) {
        handlers.onConfigChange("settings.scoring.bands[" + i + "].label", v);
      })));
      row.appendChild(field("Min %", numberInput(b.min, function (v) {
        handlers.onConfigChange("settings.scoring.bands[" + i + "].min", v);
      })));
      row.appendChild(button("Remove", function () {
        bands.splice(i, 1);
        markConfigDirty();
        render();
      }));
      host.appendChild(row);
    });
  }

  function renderTrails() {
    var host = byId("omx-app-trails");
    if (!host) return;
    host.textContent = "";
    var trails = state.doc.settings.trails || [];
    trails.forEach(function (t, i) {
      var row = el("div", "omx-app-repeat-row");
      row.appendChild(field("Label", textInput(t.label, function (v) {
        handlers.onConfigChange("settings.trails[" + i + "].label", v);
      })));
      row.appendChild(field("Days", numberInput(t.days, function (v) {
        handlers.onConfigChange("settings.trails[" + i + "].days", Math.max(1, Math.trunc(v || 1)));
      })));
      row.appendChild(field("On dashboard", checkboxInput(t.showOnDashboard, function (v) {
        handlers.onConfigChange("settings.trails[" + i + "].showOnDashboard", v);
      })));
      host.appendChild(row);
    });
  }

  function renderCodes() {
    var host = byId("omx-app-codes");
    if (!host) return;
    host.textContent = "";
    var codes = state.doc.settings.codes || {};
    Object.keys(codes).forEach(function (key) {
      var c = codes[key];
      var row = el("div", "omx-app-repeat-row");
      var quoted = 'settings.codes["' + key + '"]';
      if (key === "") {
        row.appendChild(el("span", null, "Miss (no entry)"));
      } else {
        row.appendChild(field("Key", textInput(key, function (v) {
          renameCode(key, String(v).trim());
          render();
        })));
      }
      row.appendChild(field("Label", textInput(c.label, function (v) {
        handlers.onConfigChange(quoted + ".label", v);
      })));
      row.appendChild(field("Num", numberInput(c.num, function (v) {
        handlers.onConfigChange(quoted + ".num", v);
      })));
      row.appendChild(field("Den", numberInput(c.den, function (v) {
        handlers.onConfigChange(quoted + ".den", v);
      })));
      row.appendChild(field("Counter label", textInput(c.counterLabel, function (v) {
        handlers.onConfigChange(quoted + ".counterLabel", v);
      })));
      if (key !== "") {
        row.appendChild(button("Remove", function () {
          delete state.doc.settings.codes[key];
          markConfigDirty();
          render();
        }));
      }
      host.appendChild(row);
    });
  }

  function renderCategories() {
    var host = byId("omx-app-categories");
    if (!host) return;
    host.textContent = "";
    var cats = state.doc.categories || [];
    var ops = state.doc.ops || [];
    var opIndex = {};
    ops.forEach(function (o, i) { opIndex[o.id] = i; });

    cats.forEach(function (cat, ci) {
      var block = el("div", "omx-app-repeat-row");

      block.appendChild(field("Name", textInput(cat.name, function (v) {
        handlers.onConfigChange("categories[" + ci + "].name", v);
      })));
      block.appendChild(field("Started on", textInput(cat.startedOn, function (v) {
        handlers.onConfigChange("categories[" + ci + "].startedOn", v);
      })));
      block.appendChild(field("Order", numberInput(cat.order, function (v) {
        handlers.onConfigChange("categories[" + ci + "].order", v);
      })));

      var opList = el("div", "omx-app-repeat-list");
      (cat.slots || []).forEach(function (slotId) {
        var oi = opIndex[slotId];
        if (oi === undefined) return;
        var op = ops[oi];
        var opRow = el("div", "omx-app-repeat-row");
        opRow.appendChild(field("Item", textInput(op.name, function (v) {
          handlers.onConfigChange("ops[" + oi + "].name", v);
        })));
        opRow.appendChild(field("Target", textInput(op.target, function (v) {
          handlers.onConfigChange("ops[" + oi + "].target", v);
        })));
        opRow.appendChild(field("Excluded", checkboxInput(op.excluded, function (v) {
          handlers.onConfigChange("ops[" + oi + "].excluded", v);
        })));
        opList.appendChild(opRow);
      });
      block.appendChild(opList);

      var nameBox = document.createElement("input");
      nameBox.type = "text";
      nameBox.placeholder = "New item name";
      block.appendChild(nameBox);
      block.appendChild(button("Add item", function () {
        var v = nameBox.value.trim();
        if (v) handlers.onAddOp(cat.id, v);
      }));

      host.appendChild(block);
    });
  }

  function renderImportWarnings() {
    var host = byId("omx-app-import-warnings");
    if (!host) return;
    host.textContent = "";
    if (!state.importWarnings.length) return;
    host.appendChild(el("div", null, String(state.importWarnings.length) + " import warning(s)"));
    var list = el("ul");
    state.importWarnings.slice(0, 50).forEach(function (w) {
      list.appendChild(el("li", null, (w.code || "warning") + ": " + (w.message || "")));
    });
    host.appendChild(list);
  }

  function syncStaticSettingsInputs() {
    var s = state.doc.settings || {};
    var pairs = [
      ["omx-app-repo-owner", lsGet(KEYS.REPO_OWNER, DEFAULTS.repoOwner)],
      ["omx-app-repo-name", lsGet(KEYS.REPO_NAME, DEFAULTS.repoName)],
      ["omx-app-repo-path", lsGet(KEYS.REPO_PATH, DEFAULTS.repoPath)],
      ["omx-app-repo-branch", lsGet(KEYS.REPO_BRANCH, DEFAULTS.repoBranch)],
      ["omx-app-target", (s.scoring && s.scoring.target) !== undefined ? s.scoring.target : ""],
      ["omx-app-timezone", s.timezone || ""],
      ["omx-app-date-format", s.dateFormat || ""],
      ["omx-app-last-n-days", (s.dashboard && s.dashboard.lastNDays) !== undefined ? s.dashboard.lastNDays : ""],
      ["omx-app-grid-days", state.gridDays],
      ["omx-app-viewmode", state.viewMode]
    ];
    pairs.forEach(function (p) {
      var node = byId(p[0]);
      if (node && document.activeElement !== node) node.value = String(p[1]);
    });
  }

  function renderSettings() {
    if (!state.doc) return;
    syncStaticSettingsInputs();
    renderBands();
    renderTrails();
    renderCodes();
    renderCategories();
    renderImportWarnings();
  }

  // -----------------------------------------------------------------------
  // Rendering
  // -----------------------------------------------------------------------

  var VIEW_CONTAINERS = {
    grid: "omx-view-grid",
    mobile: "omx-view-mobile",
    scoreboard: "omx-view-scoreboard",
    settings: "omx-view-settings"
  };

  function applyViewMode() {
    var root = byId("omx-app");
    if (root) root.setAttribute("data-viewmode", state.viewMode);
  }

  function autoView() {
    if (state.viewMode === "desktop") return "grid";
    if (state.viewMode === "mobile") return "mobile";
    var small = false;
    try {
      small = window.matchMedia(DEFAULTS.mobileQuery).matches;
    } catch (e) { /* no matchMedia: stay desktop */ }
    return small ? "mobile" : "grid";
  }

  function render() {
    if (typeof document === "undefined") return;
    var root = byId("omx-app");
    if (!root || !state.doc) { paintBanner(); return; }

    root.setAttribute("data-view", state.view);
    applyViewMode();

    var derived = buildDerived();
    var model = clone(state.doc);
    model.mobileDate = state.mobileDate || derived.todayIso;
    deepFreeze(model);

    var name;
    for (name in VIEW_CONTAINERS) {
      if (!hasOwn(VIEW_CONTAINERS, name)) continue;
      var node = byId(VIEW_CONTAINERS[name]);
      if (node) node.hidden = name !== state.view;
    }

    var nav = byId("omx-nav");
    if (nav) {
      var btns = nav.querySelectorAll("[data-view-btn]");
      for (var i = 0; i < btns.length; i++) {
        btns[i].setAttribute("data-active", btns[i].getAttribute("data-view-btn") === state.view ? "true" : "false");
      }
    }

    if (state.view === "settings") {
      renderSettings();
    } else {
      var container = byId(VIEW_CONTAINERS[state.view]);
      var view = OM.views[state.view];
      if (container && view && typeof view.render === "function") {
        var left = container.scrollLeft;
        var top = container.scrollTop;
        try {
          view.render(container, model, derived, handlers);
        } catch (e) {
          container.textContent = "";
          container.appendChild(el("div", null, "This view could not be drawn: " + (e && e.message ? e.message : String(e))));
        }
        container.scrollLeft = left;
        container.scrollTop = top;
      }
    }

    paintBanner();
  }

  // -----------------------------------------------------------------------
  // Wiring
  // -----------------------------------------------------------------------

  function wireShell() {
    var nav = byId("omx-nav");
    if (nav) {
      nav.addEventListener("click", function (evt) {
        var btn = evt.target && evt.target.closest ? evt.target.closest("[data-view-btn]") : null;
        if (!btn) return;
        handlers.onViewSwitch(btn.getAttribute("data-view-btn"));
      });
    }

    var banner = byId("omx-sync-banner");
    if (banner) {
      var tokenBtn = banner.querySelector(".omx-app-sync-token-btn");
      if (tokenBtn) tokenBtn.addEventListener("click", function () { handlers.onViewSwitch("settings"); });
      banner.addEventListener("dblclick", function () { handlers.onSyncNow(); });
    }

    var patSave = byId("omx-app-pat-save");
    var patInput = byId("omx-app-pat");
    if (patSave && patInput) {
      patSave.addEventListener("click", function () {
        handlers.onPatSave(patInput.value);
        patInput.value = "";
      });
    }
    var patTest = byId("omx-app-pat-test");
    if (patTest) patTest.addEventListener("click", function () { handlers.onPatTest(); });

    var staticInputs = document.querySelectorAll("[data-config-path]");
    for (var i = 0; i < staticInputs.length; i++) {
      (function (node) {
        node.addEventListener("change", function () {
          var path = node.getAttribute("data-config-path");
          var value = node.type === "checkbox" ? node.checked
            : (node.type === "number" ? Number(node.value) : node.value);
          handlers.onConfigChange(path, value);
        });
      })(staticInputs[i]);
    }

    var bandAdd = byId("omx-app-band-add");
    if (bandAdd) {
      bandAdd.addEventListener("click", function () {
        var scoring = state.doc.settings.scoring || (state.doc.settings.scoring = { bands: [] });
        if (!Array.isArray(scoring.bands)) scoring.bands = [];
        scoring.bands.push({ id: "band" + scoring.bands.length, label: "New band", min: 0 });
        markConfigDirty();
        render();
      });
    }

    var codeAdd = byId("omx-app-code-add");
    if (codeAdd) {
      codeAdd.addEventListener("click", function () {
        var codes = state.doc.settings.codes || (state.doc.settings.codes = {});
        var key = "X";
        var alphabet = "XYZKLNPQRS";
        for (var a = 0; a < alphabet.length; a++) {
          if (!hasOwn(codes, alphabet.charAt(a))) { key = alphabet.charAt(a); break; }
        }
        codes[key] = { label: "New code", num: 1, den: 1, counterLabel: "New code count", satisfiesEngagement: true };
        markConfigDirty();
        render();
      });
    }

    var catAdd = byId("omx-app-category-add");
    if (catAdd) {
      catAdd.addEventListener("click", function () {
        var name = window.prompt ? window.prompt("Category name") : null;
        if (name) handlers.onAddCategory(name, todayIso());
      });
    }

    var exportLink = byId("omx-app-export");
    if (exportLink) {
      exportLink.addEventListener("click", function (evt) {
        if (state.exportPrimed) return;
        evt.preventDefault();
        handlers.onExport();
      });
    }

    var importInput = byId("omx-app-import");
    if (importInput) {
      importInput.addEventListener("change", function () {
        if (importInput.files && importInput.files.length) handlers.onImport(importInput.files[0]);
      });
    }
  }

  function wireLifecycle() {
    window.addEventListener("focus", function () { pull(); });

    if (typeof document !== "undefined") {
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") {
          if (state.flushTimer) { clearTimeout(state.flushTimer); state.flushTimer = null; }
          flush();
        } else {
          pull();
        }
      });
    }

    window.addEventListener("beforeunload", function () {
      if (state.flushTimer) { clearTimeout(state.flushTimer); state.flushTimer = null; }
      flush();
    });

    window.addEventListener("online", function () { pull(); });
    window.addEventListener("offline", function () { setSync("offline", SYNC_MESSAGES.offline); render(); });

    try {
      var mq = window.matchMedia(DEFAULTS.mobileQuery);
      var onChange = function () {
        if (state.viewMode !== "auto") return;
        if (state.view !== "grid" && state.view !== "mobile") return;
        var next = autoView();
        if (next !== state.view) { state.view = next; lsSet(KEYS.VIEW, next); render(); }
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    } catch (e) { /* no matchMedia */ }
  }

  function boot() {
    if (state.booted) return Promise.resolve();
    state.booted = true;

    state.viewMode = lsGet(KEYS.VIEWMODE, DEFAULTS.viewMode);
    state.gridDays = Math.max(1, Math.trunc(Number(lsGet(KEYS.GRID_DAYS, DEFAULTS.gridDays)) || DEFAULTS.gridDays));
    var storedView = lsGet(KEYS.VIEW, "");
    state.view = storedView && VIEW_CONTAINERS[storedView] ? storedView : autoView();
    loadQueue();

    // Draw from the cache immediately so the tick surface is usable before the network lands.
    adoptDoc(cachedDoc());
    if (state.queue.length) setSync("dirty", SYNC_MESSAGES.dirty);

    wireShell();
    wireLifecycle();
    render();

    return initStorage().then(function () {
      return pull();
    }).catch(function (e) {
      reportError(e);
      render();
    });
  }

  OM.app = {
    boot: boot,
    handlers: handlers,
    state: state,
    buildDerived: buildDerived,
    todayIso: todayIso,
    flush: flush,
    pull: pull,
    render: render,
    VERSION: "1.0.0"
  };

  if (typeof document !== "undefined" && typeof document.addEventListener === "function") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { boot(); });
    } else {
      boot();
    }
  }
})();
</script>
</body>
</html>
