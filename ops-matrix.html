/* Ops Matrix design system - v2.0.0_2026-08-18_1935.
   Implements the class census in src/INTERFACES.md section 6 exactly: every census class has a rule
   here, and no rule here names a class the census does not carry. Everything is scoped under .omx -
   no bare element selectors outside .omx, no priority overrides, no stylesheet includes, no web fonts.

   Per-view prefixes: .omx-app-* (shell, banner, settings), .omx-grid-*, .omx-mob-*, .omx-dash-*,
   plus the three shared dynamic families .omx-tone-{t}, .omx-band-{i}, .omx-code-{i}.

   Colours, font sizes and the spacing ladder are declared ONCE, inside the token block below.
   Nothing outside that block may name a colour, and every type size is set from a scale token. */

/* @tokens:start */
.omx {
  /* type: system stack only */
  --omx-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --omx-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* type scale - five steps; every font-size in this file is one of these */
  --omx-fs-xs: 11px;
  --omx-fs-sm: 12px;
  --omx-fs-md: 14px;
  --omx-fs-lg: 18px;
  --omx-fs-xl: 28px;

  /* spacing ladder - 4px base */
  --omx-sp-1: 4px;
  --omx-sp-2: 8px;
  --omx-sp-3: 12px;
  --omx-sp-4: 16px;
  --omx-sp-5: 24px;
  --omx-sp-6: 32px;

  /* shape */
  --omx-radius: 6px;
  --omx-radius-lg: 10px;
  --omx-radius-pill: 999px;

  /* surfaces and ink - LIGHT is the base palette */
  --omx-bg: #ffffff;
  --omx-surface: #f6f7f9;
  --omx-surface-2: #eceff3;
  --omx-border: #d8dce2;
  --omx-border-strong: #b9c0c9;
  --omx-text: #14171a;
  --omx-text-dim: #5b6570;
  --omx-accent: #2f6fed;
  --omx-on-accent: #ffffff;
  --omx-target-line: #2f6fed;

  /* tone grammar - what the views actually use */
  --omx-green: #2e9e5b;
  --omx-amber: #c9761b;
  --omx-red: #d64545;
  --omx-none: #8a94a0;

  /* tone TINTS - the fill half of the tone grammar (ladder segments, trail chips) */
  --omx-tint-green: rgba(46, 158, 91, 0.16);
  --omx-tint-amber: rgba(201, 118, 27, 0.18);
  --omx-tint-red: rgba(214, 69, 69, 0.15);
  --omx-tint-none: rgba(138, 148, 160, 0.12);

  /* band fills - INDEXED, because band ids are user data. 0 = lowest band */
  --omx-band-0: #d64545;
  --omx-band-1: #c9761b;
  --omx-band-2: #c9a227;
  --omx-band-3: #2e9e5b;
  --omx-band-4: #2e9e5b;
  --omx-band-5: #2e9e5b;

  /* code cell fills - SLOT-INDEXED, because the code table is user data (canon 11) */
  --omx-code-0: #d7f0e0;
  --omx-code-1: #bfe6cd;
  --omx-code-2: #f7e0d6;
  --omx-code-3: #e6e9ee;
  --omx-code-4: #e2e0f5;
  --omx-code-5: #fdf0c8;
  --omx-code-6: #d9eef8;
  --omx-code-7: #f2dfef;

  /* sync pill states */
  --omx-sync-synced: #2e9e5b;
  --omx-sync-dirty: #c9761b;
  --omx-sync-syncing: #2f6fed;
  --omx-sync-offline: #5b6570;
  --omx-sync-token: #d64545;
  --omx-sync-conflict: #d64545;

  /* surface accents */
  --omx-today-tint: rgba(47, 111, 237, 0.08);
  --omx-weekend-tint: rgba(20, 23, 26, 0.045);
  --omx-cell-hover: rgba(47, 111, 237, 0.16);
  --omx-overlay: rgba(255, 255, 255, 0.18);
  --omx-overlay-border: rgba(255, 255, 255, 0.45);
  --omx-shadow: 0 1px 2px rgba(20, 23, 26, 0.08);
  --omx-shadow-card: 0 1px 3px rgba(20, 23, 26, 0.10);
  --omx-drop-line: #2f6fed;

  font-family: var(--omx-font);
  font-size: var(--omx-fs-md);
  color: var(--omx-text);
  background: var(--omx-bg);
  box-sizing: border-box;
  /* The shell IS the viewport: fixed and inset to 0 so the flex chain below it is
     viewport-bounded on both axes. Without this the page itself scrolls and every
     position:sticky inside a view scrolls out of sight with it. */
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

@media (prefers-color-scheme: dark) {
  .omx {
    --omx-bg: #14171a;
    --omx-surface: #1d2126;
    --omx-surface-2: #23282f;
    --omx-border: #2c323a;
    --omx-border-strong: #3a424c;
    --omx-text: #eceff3;
    --omx-text-dim: #9aa4af;
    --omx-accent: #4f89f5;
    --omx-on-accent: #ffffff;
    --omx-target-line: #4f89f5;

    --omx-green: #3fb771;
    --omx-amber: #e08b2a;
    --omx-red: #e35d5d;
    --omx-none: #7d8794;

    --omx-tint-green: rgba(63, 183, 113, 0.22);
    --omx-tint-amber: rgba(224, 139, 42, 0.24);
    --omx-tint-red: rgba(227, 93, 93, 0.22);
    --omx-tint-none: rgba(125, 135, 148, 0.18);

    --omx-band-0: #e35d5d;
    --omx-band-1: #e08b2a;
    --omx-band-2: #d3b03a;
    --omx-band-3: #3fb771;
    --omx-band-4: #3fb771;
    --omx-band-5: #3fb771;

    --omx-code-0: #1e4433;
    --omx-code-1: #205a3c;
    --omx-code-2: #4a2f28;
    --omx-code-3: #2a3038;
    --omx-code-4: #33305a;
    --omx-code-5: #4a4020;
    --omx-code-6: #1e3d4d;
    --omx-code-7: #452a41;

    --omx-sync-synced: #3fb771;
    --omx-sync-dirty: #e08b2a;
    --omx-sync-syncing: #4f89f5;
    --omx-sync-offline: #7d8794;
    --omx-sync-token: #e35d5d;
    --omx-sync-conflict: #e35d5d;

    --omx-today-tint: rgba(79, 137, 245, 0.16);
    --omx-weekend-tint: rgba(236, 239, 243, 0.05);
    --omx-cell-hover: rgba(79, 137, 245, 0.24);
    --omx-overlay: rgba(255, 255, 255, 0.14);
    --omx-overlay-border: rgba(255, 255, 255, 0.35);
    --omx-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    --omx-shadow-card: 0 1px 3px rgba(0, 0, 0, 0.5);
    --omx-drop-line: #4f89f5;
  }
}
/* @tokens:end */

/* ---------------------------------------------------------------------- */
/* Base                                                                   */
/* ---------------------------------------------------------------------- */

.omx *,
.omx *::before,
.omx *::after { box-sizing: inherit; }

.omx :where(button, input, select, textarea) {
  font-family: inherit;
  font-size: var(--omx-fs-md);
  color: var(--omx-text);
  background: var(--omx-bg);
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  padding: var(--omx-sp-1) var(--omx-sp-2);
}

.omx :where(button) {
  cursor: pointer;
  background: var(--omx-surface);
}

.omx :where(button):hover { border-color: var(--omx-border-strong); }

.omx :where(button, a, input, select, textarea):focus-visible {
  outline: 2px solid var(--omx-accent);
  outline-offset: 1px;
}

.omx :where(h2, h3, p, ul) { margin: 0; }

.omx :where(ul) { padding-left: var(--omx-sp-4); }

.omx :where(table) {
  border-collapse: separate;
  border-spacing: 0;
}

/* ---------------------------------------------------------------------- */
/* Shell: nav row, sync pill, view containers                             */
/* ---------------------------------------------------------------------- */

.omx-app-nav {
  display: flex;
  align-items: center;
  gap: var(--omx-sp-3);
  padding: var(--omx-sp-2) var(--omx-sp-4);
  border-bottom: 1px solid var(--omx-border);
  background: var(--omx-surface);
  position: sticky;
  top: 0;
  z-index: 60;
  flex-wrap: wrap;
}

.omx-app-nav-brand {
  font-size: var(--omx-fs-md);
  font-weight: 700;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

.omx-app-nav-tabs {
  display: flex;
  gap: var(--omx-sp-1);
}

.omx-app-nav-btn {
  font-size: var(--omx-fs-md);
  font-weight: 600;
  padding: var(--omx-sp-1) var(--omx-sp-3);
}

.omx-app-nav-btn[data-active="true"] {
  background: var(--omx-accent);
  color: var(--omx-on-accent);
  border-color: var(--omx-accent);
}

.omx-app-sync-pill {
  display: flex;
  align-items: center;
  gap: var(--omx-sp-2);
  margin-left: auto;
  padding: var(--omx-sp-1) var(--omx-sp-3);
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius-pill);
  background: var(--omx-bg);
  color: var(--omx-text-dim);
  font-size: var(--omx-fs-sm);
  /* never a banner: the pill is content-sized and docked right, on whichever
     nav line it lands on (INTERFACES.md 8.2, banner rule) */
  flex: 0 0 auto;
  align-self: center;
  max-width: 100%;
}

.omx-app-sync-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--omx-radius-pill);
  background: var(--omx-sync-offline);
  flex: 0 0 auto;
}

.omx-app-sync-pill[data-state="synced"] .omx-app-sync-dot            { background: var(--omx-sync-synced); }
.omx-app-sync-pill[data-state="dirty"] .omx-app-sync-dot             { background: var(--omx-sync-dirty); }
.omx-app-sync-pill[data-state="syncing"] .omx-app-sync-dot           { background: var(--omx-sync-syncing); }
.omx-app-sync-pill[data-state="offline"] .omx-app-sync-dot           { background: var(--omx-sync-offline); }
.omx-app-sync-pill[data-state="token-needed"] .omx-app-sync-dot      { background: var(--omx-on-accent); }
.omx-app-sync-pill[data-state="conflict-retrying"] .omx-app-sync-dot { background: var(--omx-sync-conflict); }

/* token-needed is the one loud state: it must survive being ignored mid-use */
.omx-app-sync-pill[data-state="token-needed"] {
  background: var(--omx-sync-token);
  border-color: var(--omx-sync-token);
  color: var(--omx-on-accent);
  font-weight: 600;
}

.omx-app-sync-pill[data-state="conflict-retrying"] { border-color: var(--omx-sync-conflict); }

.omx-app-sync-message {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 32ch;
}

.omx-app-sync-dirty {
  font-variant-numeric: tabular-nums;
  font-size: var(--omx-fs-xs);
  opacity: 0.9;
}

.omx-app-sync-token-btn {
  font-size: var(--omx-fs-xs);
  font-weight: 600;
  padding: 2px var(--omx-sp-2);
  background: var(--omx-overlay);
  color: var(--omx-on-accent);
  border-color: var(--omx-overlay-border);
}

.omx-app-main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.omx-app-view-container {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
}

.omx-app-view-container[hidden] { display: none; }

.omx-app-view-error {
  padding: var(--omx-sp-4);
  color: var(--omx-red);
  font-size: var(--omx-fs-md);
}

.omx-app-visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ---------------------------------------------------------------------- */
/* Settings (app.js builds the whole panel)                               */
/* ---------------------------------------------------------------------- */

.omx-app-settings { padding: var(--omx-sp-4); }

.omx-app-settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: var(--omx-sp-4);
  align-items: start;
}

.omx-app-settings-card {
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius-lg);
  background: var(--omx-surface);
  box-shadow: var(--omx-shadow);
  padding: var(--omx-sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-3);
  min-width: 0;
}

.omx-app-settings-card-wide { grid-column: 1 / -1; }

.omx-app-settings-card-title {
  font-size: var(--omx-fs-lg);
  font-weight: 700;
  line-height: 1.2;
}

/* A field packs to its own content. The 180px basis belongs to the ROW context only -
   as a direct child of a column-flex card it would be read as a 180px MAIN-axis
   (i.e. vertical) basis and blow a phantom gap under every control. */
.omx-app-field {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-1);
  min-width: 0;
  flex: 0 0 auto;
}

.omx-app-field-label {
  font-size: var(--omx-fs-sm);
  color: var(--omx-text-dim);
}

.omx-app-field-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--omx-sp-3);
  align-items: flex-end;
}

.omx-app-field-row .omx-app-field { flex: 1 1 180px; }

.omx-app-help-text {
  font-size: var(--omx-fs-sm);
  color: var(--omx-text-dim);
  line-height: 1.5;
}

.omx-app-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--omx-sp-2);
  align-items: center;
}

.omx-app-btn {
  font-size: var(--omx-fs-md);
  font-weight: 600;
  padding: var(--omx-sp-1) var(--omx-sp-3);
}

.omx-app-btn-primary {
  background: var(--omx-accent);
  color: var(--omx-on-accent);
  border-color: var(--omx-accent);
}

.omx-app-btn-danger {
  color: var(--omx-red);
  border-color: var(--omx-border-strong);
  font-size: var(--omx-fs-sm);
}

.omx-app-table-host {
  overflow-x: auto;
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: var(--omx-bg);
}

.omx-app-table {
  width: 100%;
  font-size: var(--omx-fs-sm);
}

.omx-app-table-head-row { background: var(--omx-surface-2); }

.omx-app-table-head-cell {
  text-align: left;
  font-size: var(--omx-fs-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--omx-text-dim);
  padding: var(--omx-sp-2) var(--omx-sp-1);
  border-bottom: 1px solid var(--omx-border);
}

.omx-app-table-row { background: var(--omx-bg); }

.omx-app-table-cell {
  padding: var(--omx-sp-1);
  border-bottom: 1px solid var(--omx-border);
  vertical-align: middle;
}

/* Mini-table controls carry the browser's ~20ch intrinsic width, which is what pushed the
   MIN / ON DASHBOARD columns past the card edge. Let them shrink with the column instead. */
.omx-app-table-cell :where(input:not([type="checkbox"]), select) {
  width: 100%;
  min-width: 4ch;
}

/* --- drag and drop (categories, and items inside a category) ----------- */

.omx-app-dnd-list {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-2);
  position: relative;
}

.omx-app-dnd-row {
  display: flex;
  align-items: flex-start;
  gap: var(--omx-sp-2);
  padding: var(--omx-sp-2);
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: var(--omx-bg);
  min-width: 0;
}

.omx-app-dnd-row[data-dnd-scope="category"] { background: var(--omx-surface-2); }

.omx-app-dnd-row[data-dragging="true"] {
  opacity: 0.55;
  border-color: var(--omx-accent);
}

.omx-app-dnd-row[data-lifted="true"] {
  border-color: var(--omx-accent);
  box-shadow: var(--omx-shadow-card);
}

.omx-app-dnd-handle {
  flex: 0 0 auto;
  width: 28px;
  min-height: 28px;
  padding: 0;
  font-size: var(--omx-fs-md);
  line-height: 1;
  color: var(--omx-text-dim);
  cursor: grab;
  touch-action: none;
}

.omx-app-dnd-body {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-2);
}

.omx-app-dnd-indicator {
  height: 2px;
  border-radius: var(--omx-radius-pill);
  background: var(--omx-drop-line);
  margin: 0;
}

.omx-app-dnd-status { position: absolute; }

.omx-app-new-op-name { flex: 1 1 200px; }

.omx-app-export-link {
  display: inline-block;
  align-self: flex-start;
  padding: var(--omx-sp-1) var(--omx-sp-3);
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: var(--omx-bg);
  color: var(--omx-accent);
  text-decoration: none;
  font-size: var(--omx-fs-md);
  font-weight: 600;
}

.omx-app-import-warnings {
  font-size: var(--omx-fs-sm);
  color: var(--omx-amber);
}

.omx-app-import-warning-count { font-weight: 700; }

.omx-app-import-warning-list { margin-top: var(--omx-sp-1); }

.omx-app-import-warning-item { line-height: 1.5; }

/* ---------------------------------------------------------------------- */
/* Grid view - ONE table, sticky on both axes                             */
/* ---------------------------------------------------------------------- */

.omx-grid-root {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.omx-grid-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  background: var(--omx-bg);
}

.omx-grid-table {
  font-size: var(--omx-fs-sm);
  min-width: 100%;
}

.omx-grid-head-row { height: 40px; }

.omx-grid-corner-cell {
  position: sticky;
  top: 0;
  left: 0;
  z-index: 40;
  background: var(--omx-surface);
  border-bottom: 1px solid var(--omx-border-strong);
  border-right: 1px solid var(--omx-border-strong);
  min-width: 220px;
  text-align: left;
}

.omx-grid-date-cell {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--omx-surface);
  border-bottom: 1px solid var(--omx-border-strong);
  border-right: 1px solid var(--omx-border);
  padding: var(--omx-sp-1) 2px;
  font-weight: 600;
  white-space: nowrap;
  text-align: center;
  line-height: 1.15;
}

.omx-grid-date-cell[data-weekend="true"] { background: var(--omx-surface-2); }

.omx-grid-date-cell[data-today="true"] {
  background: var(--omx-today-tint);
  box-shadow: inset 2px 0 0 var(--omx-target-line), inset -2px 0 0 var(--omx-target-line),
    inset 0 2px 0 var(--omx-target-line);
  color: var(--omx-accent);
}

.omx-grid-date-dow {
  display: block;
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.omx-grid-date-label {
  display: block;
  font-size: var(--omx-fs-xs);
  font-variant-numeric: tabular-nums;
}

.omx-grid-stats-head-cell {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--omx-surface);
  border-bottom: 1px solid var(--omx-border-strong);
  border-left: 1px solid var(--omx-border-strong);
  min-width: 56px;
  padding: var(--omx-sp-1);
}

.omx-grid-category-row { height: 34px; }

.omx-grid-category-cell {
  background: var(--omx-surface-2);
  border-top: 1px solid var(--omx-border-strong);
  border-bottom: 1px solid var(--omx-border);
  padding: 0;
  text-align: left;
}

/* The divider row's content box spans the whole table. Only the LABEL is sticky:
   a sticky box is clamped so it can never leave its containing block, so a sticky box
   wider than the scrollport (the old inline-flex carrying the chips as well) stops
   short of the left edge at full right scroll and clips its own first characters. */
.omx-grid-category-inner {
  display: flex;
  align-items: baseline;
  gap: var(--omx-sp-3);
  min-width: 0;
}

.omx-grid-category-label {
  position: sticky;
  left: 0;
  z-index: 10;
  display: inline-flex;
  align-items: baseline;
  gap: var(--omx-sp-3);
  flex: 0 0 auto;
  padding: var(--omx-sp-1) var(--omx-sp-3);
  background: var(--omx-surface-2);
}

.omx-grid-category-name {
  font-size: var(--omx-fs-md);
  font-weight: 700;
  white-space: nowrap;
}

.omx-grid-category-today {
  font-size: var(--omx-fs-md);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.omx-grid-trail-chip {
  flex: 0 0 auto;
  font-size: var(--omx-fs-xs);
  font-weight: 600;
  padding: 1px var(--omx-sp-2);
  border-radius: var(--omx-radius-pill);
  background: var(--omx-bg);
  border: 1px solid var(--omx-border);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.omx-grid-op-row { height: 30px; }

.omx-grid-op-cell {
  position: sticky;
  left: 0;
  z-index: 20;
  background: var(--omx-bg);
  border-right: 1px solid var(--omx-border-strong);
  border-bottom: 1px solid var(--omx-border);
  padding: 0 var(--omx-sp-2);
  min-width: 220px;
  max-width: 220px;
  text-align: left;
  font-weight: 400;
}

.omx-grid-op-cell[data-excluded="true"] { color: var(--omx-text-dim); }

.omx-grid-op-name {
  display: inline-block;
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: middle;
  font-size: var(--omx-fs-sm);
}

.omx-grid-op-target {
  margin-left: var(--omx-sp-2);
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  font-variant-numeric: tabular-nums;
}

.omx-grid-cell-wrap {
  padding: 0;
  border-right: 1px solid var(--omx-border);
  border-bottom: 1px solid var(--omx-border);
}

.omx-grid-cell-wrap[data-weekend="true"] { background: var(--omx-weekend-tint); }

.omx-grid-cell-wrap[data-today="true"] {
  background: var(--omx-today-tint);
  box-shadow: inset 2px 0 0 var(--omx-target-line), inset -2px 0 0 var(--omx-target-line);
}

.omx-grid-cell {
  display: block;
  width: 32px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--omx-text);
  text-align: center;
  font-family: var(--omx-mono);
  font-size: var(--omx-fs-sm);
  font-weight: 700;
  line-height: 30px;
  cursor: pointer;
  user-select: none;
}

.omx-grid-cell:hover { background: var(--omx-cell-hover); }

.omx-grid-cell:focus-visible {
  outline: 2px solid var(--omx-accent);
  outline-offset: -2px;
}

.omx-grid-stats-cell {
  border-left: 1px solid var(--omx-border-strong);
  border-bottom: 1px solid var(--omx-border);
  background: var(--omx-surface);
  padding: 0 var(--omx-sp-2);
  text-align: right;
}

.omx-grid-stats-value {
  font-size: var(--omx-fs-xs);
  font-variant-numeric: tabular-nums;
  color: var(--omx-text-dim);
}

/* ---------------------------------------------------------------------- */
/* Mobile view - one centered column, 44px targets                        */
/* ---------------------------------------------------------------------- */

.omx-mob-root {
  flex: 1 1 auto;
  min-height: 0;
  background: var(--omx-bg);
}

.omx-mob-column {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 var(--omx-sp-3) var(--omx-sp-6) var(--omx-sp-3);
}

.omx-mob-stepper {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--omx-sp-2);
  min-height: 44px;
  padding: var(--omx-sp-2) 0;
  background: var(--omx-bg);
  border-bottom: 1px solid var(--omx-border);
}

.omx-mob-step-btn {
  min-width: 44px;
  min-height: 44px;
  font-size: var(--omx-fs-md);
  font-weight: 600;
  flex: 0 0 auto;
}

.omx-mob-step-date {
  flex: 1 1 auto;
  text-align: center;
  line-height: 1.2;
  min-width: 0;
}

.omx-mob-step-dow {
  display: block;
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.omx-mob-step-label {
  display: block;
  font-size: var(--omx-fs-lg);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.omx-mob-step-today {
  min-height: 44px;
  font-size: var(--omx-fs-sm);
  font-weight: 600;
  flex: 0 0 auto;
}

.omx-mob-progress {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-1);
  padding: var(--omx-sp-3) 0;
}

.omx-mob-progress-bar {
  height: 6px;
  border-radius: var(--omx-radius-pill);
  background: var(--omx-surface-2);
  overflow: hidden;
}

.omx-mob-progress-fill {
  height: 100%;
  background: var(--omx-accent);
  border-radius: var(--omx-radius-pill);
}

.omx-mob-progress-text {
  font-size: var(--omx-fs-sm);
  color: var(--omx-text-dim);
  font-variant-numeric: tabular-nums;
}

.omx-mob-list {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-5);
}

.omx-mob-category {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-2);
}

.omx-mob-category-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--omx-sp-2);
  padding-bottom: var(--omx-sp-1);
  border-bottom: 1px solid var(--omx-border);
}

.omx-mob-category-name {
  font-size: var(--omx-fs-md);
  font-weight: 700;
}

.omx-mob-category-score {
  font-size: var(--omx-fs-md);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.omx-mob-op-row {
  display: flex;
  align-items: center;
  gap: var(--omx-sp-3);
  width: 100%;
  min-height: 56px;
  padding: var(--omx-sp-2) var(--omx-sp-2) var(--omx-sp-2) var(--omx-sp-3);
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: var(--omx-bg);
  text-align: left;
  font-size: var(--omx-fs-md);
}

.omx-mob-op-name {
  flex: 1 1 auto;
  min-width: 0;
  line-height: 1.3;
}

/* Fixed 44x44 - the chip must NOT grow with its label, or every row's right edge
   jitters with the length of the code word. The label ellipsizes inside it, and the
   chip is transparent so the row's slot-indexed code fill reads straight through. */
.omx-mob-op-code {
  flex: 0 0 auto;
  display: inline-block;
  width: 44px;
  height: 44px;
  padding: 0 2px;
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius);
  background: transparent;
  font-size: var(--omx-fs-xs);
  font-weight: 700;
  text-align: center;
  line-height: 42px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------------------------------------------------------------------- */
/* Scoreboard - stat tiles, equal-height cards, tone ladder               */
/* ---------------------------------------------------------------------- */

.omx-dash-root {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-4);
  padding: var(--omx-sp-4);
}

.omx-dash-header {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-3);
}

.omx-dash-date {
  font-size: var(--omx-fs-sm);
  color: var(--omx-text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.omx-dash-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--omx-sp-3);
}

.omx-dash-stat-tile {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-1);
  padding: var(--omx-sp-3) var(--omx-sp-4);
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius-lg);
  background: var(--omx-surface);
}

.omx-dash-stat-value {
  font-size: var(--omx-fs-xl);
  font-weight: 800;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}

.omx-dash-stat-label {
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.omx-dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  grid-auto-rows: 1fr;
  gap: var(--omx-sp-4);
}

.omx-dash-card {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-3);
  padding: var(--omx-sp-4);
  border: 1px solid var(--omx-border);
  border-radius: var(--omx-radius-lg);
  background: var(--omx-surface);
  box-shadow: var(--omx-shadow-card);
  min-width: 0;
}

.omx-dash-card-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--omx-sp-2);
  padding-bottom: var(--omx-sp-2);
  border-bottom: 1px solid var(--omx-border);
}

.omx-dash-card-title {
  font-size: var(--omx-fs-md);
  font-weight: 700;
  line-height: 1.25;
  min-width: 0;
}

.omx-dash-card-count {
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.omx-dash-trails {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: var(--omx-sp-2);
}

.omx-dash-trail-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.omx-dash-trail-label {
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.omx-dash-trail-value {
  font-size: var(--omx-fs-lg);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.omx-dash-today {
  display: flex;
  align-items: baseline;
  gap: var(--omx-sp-2);
  flex-wrap: wrap;
}

.omx-dash-today-label {
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.omx-dash-today-value {
  font-size: var(--omx-fs-xl);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.omx-dash-today-target {
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

.omx-dash-unticked {
  display: flex;
  flex-direction: column;
  gap: var(--omx-sp-1);
  font-size: var(--omx-fs-sm);
}

.omx-dash-unticked-title {
  font-size: var(--omx-fs-xs);
  color: var(--omx-text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.omx-dash-unticked-list {
  margin: 0;
  color: var(--omx-text-dim);
}

.omx-dash-unticked-item { line-height: 1.5; }

.omx-dash-unticked-empty {
  color: var(--omx-green);
  font-weight: 600;
}

.omx-dash-ladder {
  margin-top: auto;
  padding-top: var(--omx-sp-2);
  border-top: 1px solid var(--omx-border);
}

.omx-dash-ladder-strip {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: var(--omx-sp-1);
}

.omx-dash-ladder-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 44px;
  padding: var(--omx-sp-1) 2px;
  border-radius: var(--omx-radius);
  border: 1px solid currentColor;
  background: var(--omx-bg);
}

.omx-dash-ladder-dow {
  font-size: var(--omx-fs-xs);
  font-weight: 700;
  text-transform: uppercase;
  opacity: 0.8;
}

.omx-dash-ladder-value {
  font-size: var(--omx-fs-sm);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ---------------------------------------------------------------------- */
/* Shared dynamic families: tone, band, code                              */
/*                                                                        */
/* LAST ON PURPOSE. Every one of these is a single-class selector, so it   */
/* ties on specificity with the component rule it has to paint over        */
/* (.omx-grid-cell, .omx-mob-op-row, the :where(button) base - all of      */
/* which declare their own background). Source order is the only tie-      */
/* breaker available without !important, so the fill families come last.   */
/* ---------------------------------------------------------------------- */

.omx-tone-green { color: var(--omx-green); }
.omx-tone-amber { color: var(--omx-amber); }
.omx-tone-red   { color: var(--omx-red); }
.omx-tone-none  { color: var(--omx-none); }

/* The fill half of the tone grammar: a toned surface reads as a filled chip, not as a
   hairline outline that samples the same as the card behind it. */
.omx-dash-ladder-day.omx-tone-green { background: var(--omx-tint-green); border-color: var(--omx-green); }
.omx-dash-ladder-day.omx-tone-amber { background: var(--omx-tint-amber); border-color: var(--omx-amber); }
.omx-dash-ladder-day.omx-tone-red   { background: var(--omx-tint-red); border-color: var(--omx-red); }
.omx-dash-ladder-day.omx-tone-none  { background: var(--omx-tint-none); border-color: var(--omx-none); }

.omx-grid-trail-chip.omx-tone-green { background: var(--omx-tint-green); border-color: var(--omx-green); }
.omx-grid-trail-chip.omx-tone-amber { background: var(--omx-tint-amber); border-color: var(--omx-amber); }
.omx-grid-trail-chip.omx-tone-red   { background: var(--omx-tint-red); border-color: var(--omx-red); }
.omx-grid-trail-chip.omx-tone-none  { background: var(--omx-tint-none); border-color: var(--omx-none); }

.omx-band-0 { background: var(--omx-band-0); }
.omx-band-1 { background: var(--omx-band-1); }
.omx-band-2 { background: var(--omx-band-2); }
.omx-band-3 { background: var(--omx-band-3); }
.omx-band-4 { background: var(--omx-band-4); }
.omx-band-5 { background: var(--omx-band-5); }

.omx-code-0 { background: var(--omx-code-0); }
.omx-code-1 { background: var(--omx-code-1); }
.omx-code-2 { background: var(--omx-code-2); }
.omx-code-3 { background: var(--omx-code-3); }
.omx-code-4 { background: var(--omx-code-4); }
.omx-code-5 { background: var(--omx-code-5); }
.omx-code-6 { background: var(--omx-code-6); }
.omx-code-7 { background: var(--omx-code-7); }

/* ---------------------------------------------------------------------- */
/* Narrow viewports - phone widths down to 320px                          */
/* ---------------------------------------------------------------------- */

@media (max-width: 560px) {
  .omx-app-nav { gap: var(--omx-sp-2); }

  /* the pill stays a pill: short message, no full-width banner on the wrapped line */
  .omx-app-sync-message { max-width: 13ch; }

  /* the divider row keeps its sticky label; the trail chips are the first thing to go
     rather than run off the right edge */
  .omx-grid-trail-chip { display: none; }

  .omx-app-settings-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="omx-app" class="omx" data-viewmode="auto" data-view="grid">

  <nav id="omx-nav" class="omx-app-nav">
    <span class="omx-app-nav-brand">Ops Matrix</span>
    <div class="omx-app-nav-tabs">
      <button type="button" class="omx-app-nav-btn" data-view-btn="grid">Grid</button>
      <button type="button" class="omx-app-nav-btn" data-view-btn="mobile">Mobile</button>
      <button type="button" class="omx-app-nav-btn" data-view-btn="scoreboard">Scoreboard</button>
      <button type="button" class="omx-app-nav-btn" data-view-btn="settings">Settings</button>
    </div>
    <div id="omx-sync-banner" class="omx-app-sync-pill" data-state="offline">
      <span class="omx-app-sync-dot"></span>
      <span class="omx-app-sync-message"></span>
      <span class="omx-app-sync-dirty"></span>
      <button type="button" class="omx-app-sync-token-btn" hidden>Settings</button>
    </div>
  </nav>

  <main class="omx-app-main">
    <div id="omx-view-grid" class="omx-app-view-container"></div>
    <div id="omx-view-mobile" class="omx-app-view-container" hidden></div>
    <div id="omx-view-scoreboard" class="omx-app-view-container" hidden></div>
    <div id="omx-view-settings" class="omx-app-view-container omx-app-settings" hidden></div>
  </main>

</div>

<script>window.OpsMatrix = window.OpsMatrix || { views: {}, storage: {}, util: {} };</script>
<script>
/*
 * Ops Matrix calculation engine.
 *
 * Implements scripts/ops-matrix/spec/engine-spec.md and engine-spec.json, spec version
 * 1.0.0_2026-08-18_1349. Pure functions over one JSON document; no derived value is ever
 * stored, no clock is ever read, no number that affects output is a literal in this file
 * (every one of them is reachable from settings).
 *
 * Loadable two ways:
 *   node     - `var Engine = require('./engine.js');`
 *   browser  - plain concatenation; the file declares one global `Engine`.
 * It requires nothing at all, project file or otherwise.
 */

var Engine = (function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Constants that are NOT scoring numbers. None of these changes any score.

    return function unsubscribe() {
      var idx = self._listeners.indexOf(callback);

  LocalStorageAdapter.prototype.capabilities = function () {
    return { remote: false, realtime: false, multiUser: false, canExport: true, needsToken: false };
  };

  // ---------------------------------------------------------------------
  // MemoryAdapter
  // ---------------------------------------------------------------------

  function MemoryAdapter() {
    this._doc = null;

  MemoryAdapter.prototype.init = function () {
    return Promise.resolve({ ok: true, capabilities: this.capabilities() });
  };

  MemoryAdapter.prototype._meta = function () {
    return { sha: null, source: "memory", fetchedAt: nowIso(), dirty: 0 };

  MemoryAdapter.prototype.readAll = function () {

  function create(kind, opts) {

  window.OpsMatrix.storage.create = create;

      var prevTd = td.previousElementSibling;
      if (prevTd) focusTarget = prevTd.querySelector(".omx-grid-cell");
    } else if (key === "ArrowRight") {
      var nextTd = td.nextElementSibling;
      if (nextTd) focusTarget = nextTd.querySelector(".omx-grid-cell");

      var prevTr = findAdjacentOpRow(tr, false);
      if (prevTr && prevTr.children[cellIndex]) {

    root.appendChild(scroll);

          }
        }
      }

  }

  function entryKey(opId, dateIso) {
    return opId + "|" + dateIso;
  }

  function emptyContainer(container) {
    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }
  }

  function findAxisIndex(dateAxis, dateIso) {
    for (var i = 0; i < dateAxis.length; i++) {
      if (dateAxis[i].d === dateIso) return i;
    }
    return -1;
  }

  // The one local code map per render (INTERFACES.md 5.1, code fill law): key -> code row,
  // which carries both the chip label and the slotIndex the fill class is built from.
  function buildCodeMap(codes) {
    var map = {};
    for (var i = 0; i < codes.length; i++) {
      map[codes[i].key] = codes[i];
    }
    return map;
  }

  function buildStepper(derived, handlers, currentDate, currentEntry, prevEntry, nextEntry) {
    var stepper = el("div", { className: "omx-mob-stepper" });

    var prevBtn = el("button", {
      className: "omx-mob-step-btn",
      text: "‹ Prev",
      attrs: { type: "button", "data-step": "prev" }
    });
    if (!prevEntry) prevBtn.disabled = true;
    prevBtn.addEventListener("click", function () {
      if (prevEntry) handlers.onDateChange(prevEntry.d);
    });
    stepper.appendChild(prevBtn);

    var dateBlock = el("div", { className: "omx-mob-step-date" });
    dateBlock.appendChild(el("span", {
      className: "omx-mob-step-dow",
      text: currentEntry ? currentEntry.dow : ""
    }));
    dateBlock.appendChild(el("span", {
      className: "omx-mob-step-label",
      text: currentEntry ? currentEntry.label : ""
    }));
    stepper.appendChild(dateBlock);

    var todayBtn = el("button", {
      className: "omx-mob-step-today",
      text: "Today",
      attrs: { type: "button" }
    });
    if (currentDate === derived.todayIso) todayBtn.disabled = true;
    todayBtn.addEventListener("click", function () {
      handlers.onDateChange(derived.todayIso);
    });
    stepper.appendChild(todayBtn);

    var nextBtn = el("button", {
      className: "omx-mob-step-btn",
      text: "Next ›",
      attrs: { type: "button", "data-step": "next" }
    });
    if (!nextEntry) nextBtn.disabled = true;
    nextBtn.addEventListener("click", function () {
      if (nextEntry) handlers.onDateChange(nextEntry.d);
    });
    stepper.appendChild(nextBtn);

    var bar = el("div", { className: "omx-mob-progress-bar" });

    var pct = totalOps > 0 ? Math.round((doneOps / totalOps) * 100) : 0;
    fill.style.width = pct + "%";
    bar.appendChild(fill);
    progress.appendChild(bar);

    var text = el("span", { className: "omx-mob-progress-text" });
    text.textContent = doneOps + " of " + totalOps + " done";
    progress.appendChild(text);

    return progress;
  }

  function buildOpRow(op, cat, currentDate, codeMap, handlers) {
    var key = entryKey(op.id, currentDate);
    var code = cat.cells ? cat.cells[key] : undefined;
    var codeEntry = code ? codeMap[code] : null;

    var row = el("button", {
      className: "omx-mob-op-row",
      attrs: { type: "button", "data-op-id": op.id, "data-code": code || "" }
    });
    // Fills stop at eight slots (--omx-code-0 … --omx-code-7); a later code renders unfilled.
    if (codeEntry && codeEntry.slotIndex >= 0 && codeEntry.slotIndex <= 7) {
      row.classList.add("omx-code-" + codeEntry.slotIndex);
    }

    row.appendChild(el("span", { className: "omx-mob-op-name", text: op.name }));

    var codeSpan = codeEntry
      ? el("span", { className: "omx-mob-op-code", text: codeEntry.label })
      : el("span", { className: "omx-mob-op-code" });
    row.appendChild(codeSpan);

    row.addEventListener("click", function () {
      handlers.onTick(op.id, currentDate);
    });

    return row;
  }

  function buildCategory(cat, currentDate, codeMap, handlers) {
    var section = el("section", {
      className: "omx-mob-category",
      attrs: { "data-category-id": cat.id }
    });

    var head = el("div", { className: "omx-mob-category-head" });
    head.appendChild(el("span", { className: "omx-mob-category-name", text: cat.name }));

    var scoreTone = cat.today ? cat.today.tone : "none";

      text: cat.today ? cat.today.display : "--"

    section.appendChild(head);

    var ops = cat.ops || [];
    for (var i = 0; i < ops.length; i++) {
      section.appendChild(buildOpRow(ops[i], cat, currentDate, codeMap, handlers));
    }

    return section;
  }

  function render(container, model, derived, handlers) {
    emptyContainer(container);

    var root = el("div", { className: "omx-mob-root" });
    var column = el("div", { className: "omx-mob-column" });

    var dateAxis = derived.dateAxis || [];
    var currentDate = derived.focusDate;
    var idx = findAxisIndex(dateAxis, currentDate);
    var currentEntry = idx >= 0 ? dateAxis[idx] : null;
    var prevEntry = idx > 0 ? dateAxis[idx - 1] : null;
    var nextEntry = idx >= 0 && idx < dateAxis.length - 1 ? dateAxis[idx + 1] : null;

    column.appendChild(buildStepper(derived, handlers, currentDate, currentEntry, prevEntry, nextEntry));

    var categories = derived.categories || [];
    var totalOps = 0;
    var doneOps = 0;
    for (var c = 0; c < categories.length; c++) {
      var cat = categories[c];
      var ops = cat.ops || [];
      for (var o = 0; o < ops.length; o++) {
        totalOps += 1;
        var key = entryKey(ops[o].id, currentDate);
        var code = cat.cells ? cat.cells[key] : undefined;
        if (code) doneOps += 1;
      }

    column.appendChild(buildProgress(doneOps, totalOps));

    var codeMap = buildCodeMap(derived.codes || []);

    var list = el("div", { className: "omx-mob-list" });
    for (var ci = 0; ci < categories.length; ci++) {
      list.appendChild(buildCategory(categories[ci], currentDate, codeMap, handlers));
    }
    column.appendChild(list);

    root.appendChild(column);
    container.appendChild(root);
  }

  window.OpsMatrix.views.mobile = { render: render };
})();

        n += 1;
        if (target !== null && sc >= target) onTarget += 1;
      }
      untickedCount += categories[i].unticked.length;
    }
    var overallScore = n > 0 ? sum / n : null;
    var overallBand = engineCall(function () { return OM.engine.band(settings, overallScore); }, null);

    return deepFreeze({
      todayIso: today,
      todayLabel: longDate(today),
      focusDate: focusDate,
      focusDateLabel: mediumDate(focusDate),
      target: target,
      targetLabel: target === null ? "--" : String(target) + "%",
      bands: bands,
      codes: codes,
      cycle: cycle,
      gridDays: state.gridDays,
      dateAxis: axis,
      categories: categories,
      overall: {
        todayScore: overallScore,
        tone: toneForBand(bands, overallBand),
        display: pct(overallScore),
        untickedCount: untickedCount,
        categoriesOnTarget: onTarget,
        categoriesTotal: categories.length
      },
      sync: {
        state: state.sync.state,
        dirty: state.queue.length + (state.configDirty ? 1 : 0),
        lastSyncIso: state.lastSyncIso,
        message: state.sync.message
      }
    });
  }

  // -----------------------------------------------------------------------
  // Sync pill
  // -----------------------------------------------------------------------

  function setSync(nextState, message) {
    state.sync.state = nextState;
    state.sync.message = message || SYNC_MESSAGES[nextState] || nextState;
    paintPill();
  }

  function paintPill() {
    var pill = byId("omx-sync-banner");
    if (!pill) return;
    pill.setAttribute("data-state", state.sync.state);
    var msg = pill.querySelector(".omx-app-sync-message");
    if (msg) msg.textContent = state.sync.message;
    var dirty = pill.querySelector(".omx-app-sync-dirty");
    var count = state.queue.length + (state.configDirty ? 1 : 0);
    if (dirty) dirty.textContent = count > 0 ? String(count) : "";
    var btn = pill.querySelector(".omx-app-sync-token-btn");
    if (btn) btn.hidden = state.sync.state !== "token-needed";
  }

  function reportError(e) {
    var code = e && e.code;
    var msg = (e && e.message) || String(e);
    state.lastError = msg;
    if (code === ERR.NO_TOKEN || code === ERR.BAD_TOKEN) {
      setSync("token-needed", code === ERR.BAD_TOKEN ? "Token rejected by GitHub" : SYNC_MESSAGES["token-needed"]);
    } else if (code === ERR.NETWORK) {
      setSync("offline", SYNC_MESSAGES.offline);
    } else if (code === ERR.RATE_LIMIT) {
      setSync("offline", "GitHub rate limit - retrying later");
    } else if (code === ERR.CONFLICT) {
      setSync("conflict-retrying", "Remote changed - merging and retrying");
      if (state.conflictTimer) clearTimeout(state.conflictTimer);
      state.conflictTimer = setTimeout(function () {
        state.conflictTimer = null;
        if (state.queue.length || state.configDirty) {
          setSync("dirty", SYNC_MESSAGES.dirty);
          scheduleFlush(0);
        } else {
          setSync("synced", SYNC_MESSAGES.synced);
        }
        render();
      }, DEFAULTS.conflictRetryMs);
    } else if (code === ERR.QUOTA) {
      setSync("offline", "This device is out of storage");
    } else if (code === ERR.NOT_FOUND) {
      setSync("dirty", "Data file not created yet - it will be written on the next save");
    } else if (code === ERR.PARSE) {
      setSync("offline", "Stored data could not be read");
    } else {
      setSync("offline", msg);
    }
  }

  // -----------------------------------------------------------------------
  // Storage
  // -----------------------------------------------------------------------

  function repoOpts() {
    return {
      owner: lsGet(KEYS.REPO_OWNER, DEFAULTS.repoOwner),
      name: lsGet(KEYS.REPO_NAME, DEFAULTS.repoName),
      path: lsGet(KEYS.REPO_PATH, DEFAULTS.repoPath),
      branch: lsGet(KEYS.REPO_BRANCH, DEFAULTS.repoBranch),
      pat: lsGet(KEYS.PAT, "")
    };
  }

  function chooseKind() {
    var o = repoOpts();
    return (o.pat && o.owner && o.name && o.path) ? "github" : "local";
  }

  function initStorage() {
    if (state.unsubscribe) {
      try { state.unsubscribe(); } catch (e) { /* ignore */ }
      state.unsubscribe = null;
    }
    var kind = chooseKind();
    state.adapterKind = kind;
    state.adapter = OM.storage.create(kind);
    var opts = repoOpts();
    return state.adapter.init(opts).then(function (res) {
      state.unsubscribe = state.adapter.onExternalChange(function (evt) {
        if (evt && evt.doc) {
          state.doc = evt.doc;
          persistDocLocally();
          render();
        }
      });
      if (!res || res.ok !== true) {
        setSync("token-needed", SYNC_MESSAGES["token-needed"]);
      }
      return res;
    });
  }

  function persistDocLocally() {
    if (!state.doc) return;
    if (!lsSet(KEYS.DOC, JSON.stringify(state.doc))) {
      setSync("offline", "This device is out of storage");
    }
  }

  function persistQueue() {
    lsSet(KEYS.QUEUE, JSON.stringify(state.queue));
  }

  function loadQueue() {
    try {
      var raw = lsGet(KEYS.QUEUE, "[]");
      var parsed = JSON.parse(raw);
      state.queue = Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      state.queue = [];
    }
  }

  function cachedDoc() {
    try {
      var raw = lsGet(KEYS.DOC, "");
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return isObj(parsed) ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  function adoptDoc(raw) {
    var incoming = raw || cachedDoc() || defaultDoc();
    var result = engineCall(function () { return OM.engine.migrate(incoming); }, null);
    state.doc = result ? result.doc : incoming;
    // OpsMatrix.storage.applyChanges is the one entry-application util (INTERFACES.md 3.3).
    if (state.queue.length) OM.storage.applyChanges(state.doc, state.queue);
    persistDocLocally();
    // A device-local adapter has no remote to learn the document from, so hand it the whole
    // thing; otherwise its first writeEntry would build a document out of ticks alone.
    if (state.adapter && state.adapterKind !== "github") {
      try {
        var handoff = state.adapter.bulkImport(state.doc);
        if (handoff && typeof handoff.then === "function") {
          handoff.then(null, function (e) { reportError(e); });
        }
      } catch (e) {
        reportError(e);
      }
    }
  }

  function pull() {
    if (!state.adapter) return Promise.resolve();
    setSync("syncing", SYNC_MESSAGES.syncing);
    render();
    return state.adapter.readAll().then(function (res) {
      var hadRemoteDoc = !!(res && res.doc);
      adoptDoc(res && res.doc);
      // First run against an empty data repo: the seed just adopted has never been
      // committed, so mark it dirty and the normal flush writes it.
      if (!hadRemoteDoc && res && res.meta && res.meta.source === "github") state.configDirty = true;
      state.lastSyncIso = (res && res.meta && res.meta.fetchedAt) || new Date().toISOString();
      if (state.queue.length || state.configDirty) {
        setSync("dirty", SYNC_MESSAGES.dirty);
        scheduleFlush(DEFAULTS.debounceMs);
      } else if (state.adapterKind === "github") {
        setSync("synced", SYNC_MESSAGES.synced);
      } else if (chooseKind() === "local" && !lsGet(KEYS.PAT, "")) {
        setSync("token-needed", SYNC_MESSAGES["token-needed"]);
      } else {
        setSync("synced", SYNC_MESSAGES.synced);
      }
      render();
      return res;
    }, function (e) {
      if (!state.doc) adoptDoc(null);
      reportError(e);
      render();
    });
  }

  function scheduleFlush(delayMs) {
    if (state.flushTimer) clearTimeout(state.flushTimer);
    state.flushTimer = setTimeout(function () {
      state.flushTimer = null;
      flush();
    }, delayMs === undefined ? DEFAULTS.debounceMs : delayMs);
  }

  // ONE commit per flush: the whole batched queue goes through a single writeEntry call.
  function flush() {
    if (!state.adapter) return Promise.resolve();
    if (state.flushing) { scheduleFlush(250); return Promise.resolve(); }
    if (!state.queue.length && !state.configDirty) return Promise.resolve();

    var batch = state.queue.slice();
    var wantsConfig = state.configDirty;
    state.flushing = true;
    setSync("syncing", SYNC_MESSAGES.syncing);
    render();

    var work;
    if (wantsConfig) {
      work = state.adapter.writeConfig(state.doc).then(function () {
        state.configDirty = false;
        if (batch.length) return state.adapter.writeEntry(batch);
        return null;
      });
    } else {
      work = state.adapter.writeEntry(batch);
    }

    return work.then(function (res) {
      state.flushing = false;
      var flushed = {};
      for (var i = 0; i < batch.length; i++) flushed[entryKey(batch[i].op, batch[i].d)] = true;
      state.queue = state.queue.filter(function (ch) { return !flushed[entryKey(ch.op, ch.d)]; });
      persistQueue();
      state.lastSyncIso = (res && res.meta && res.meta.fetchedAt) || new Date().toISOString();
      if (state.queue.length || state.configDirty) {
        setSync("dirty", SYNC_MESSAGES.dirty);
        scheduleFlush(DEFAULTS.debounceMs);
      } else {
        setSync("synced", SYNC_MESSAGES.synced);
      }
      render();
    }, function (e) {
      state.flushing = false;
      reportError(e);
      render();
    });
  }

  // -----------------------------------------------------------------------
  // Config path writes
  // -----------------------------------------------------------------------

  function parsePath(path) {
    var parts = [];
    var re = /\["([^"]*)"\]|\[(\d+)\]|([^.[\]]+)/g;
    var m;
    while ((m = re.exec(path)) !== null) {
      if (m[1] !== undefined) parts.push({ k: m[1], quoted: true });
      else if (m[2] !== undefined) parts.push({ k: Number(m[2]), quoted: false });
      else parts.push({ k: m[3], quoted: false });
    }
    return parts;
  }

  function setPath(root, path, value) {
    var parts = parsePath(path);
    if (!parts.length) return false;
    var node = root;
    for (var i = 0; i < parts.length - 1; i++) {
      var k = parts[i].k;
      if (node === null || node === undefined) return false;
      if (node[k] === undefined || node[k] === null) node[k] = {};
      node = node[k];
    }
    var leaf = parts[parts.length - 1].k;
    node[leaf] = value;
    return true;
  }

  function applyLocalConfig(path, value) {
    if (path === "__local.repo.owner") { lsSet(KEYS.REPO_OWNER, String(value)); return "reinit"; }
    if (path === "__local.repo.name") { lsSet(KEYS.REPO_NAME, String(value)); return "reinit"; }
    if (path === "__local.repo.path") { lsSet(KEYS.REPO_PATH, String(value)); return "reinit"; }
    if (path === "__local.repo.branch") { lsSet(KEYS.REPO_BRANCH, String(value)); return "reinit"; }
    if (path === "__local.grid.days") {
      var n = Math.max(1, Math.trunc(Number(value) || DEFAULTS.gridDays));
      state.gridDays = n;
      lsSet(KEYS.GRID_DAYS, String(n));
      return "render";
    }
    if (path === "__local.viewmode") {
      state.viewMode = String(value);
      lsSet(KEYS.VIEWMODE, state.viewMode);
      applyViewMode();
      return "render";
    }
    return null;
  }

  function renameCode(oldKey, newKey) {
    if (!newKey || newKey === oldKey) return;
    var codes = state.doc.settings.codes;
    if (!codes || !hasOwn(codes, oldKey) || hasOwn(codes, newKey)) return;
    var rebuilt = {}, k;
    for (k in codes) {
      if (!hasOwn(codes, k)) continue;
      rebuilt[k === oldKey ? newKey : k] = codes[k];
    }
    state.doc.settings.codes = rebuilt;

    // Renaming a key rewrites history, and history is entries. writeConfig deliberately leaves
    // entries to writeEntry (INTERFACES.md 4.4), so every rewritten row also goes out as a
    // {d, op, c} change record - otherwise the rename would land locally and never be committed.
    var entries = state.doc.entries || [];
    var rewritten = [];
    var i;
    for (i = 0; i < entries.length; i++) {
      if (entries[i].c !== oldKey) continue;
      entries[i].c = newKey;
      rewritten.push({ d: entries[i].d, op: entries[i].op, c: newKey });
    }
    if (rewritten.length) {
      var touched = {};
      for (i = 0; i < rewritten.length; i++) {
        touched[entryKey(rewritten[i].op, rewritten[i].d)] = true;
      }
      state.queue = state.queue.filter(function (ch) {
        return !touched[entryKey(ch.op, ch.d)];
      }).concat(rewritten);
      persistQueue();
    }

    markConfigDirty();
  }

  function markConfigDirty() {
    state.configDirty = true;
    persistDocLocally();
    setSync("dirty", SYNC_MESSAGES.dirty);
    scheduleFlush(DEFAULTS.debounceMs);
  }

  // -----------------------------------------------------------------------
  // Handlers - the exact contract the views call
  // -----------------------------------------------------------------------

  function nextInCycle(cycle, current) {
    var cur = current === undefined ? null : current;
    var idx = cycle.indexOf(cur);
    if (idx === -1) return cycle.length ? cycle[0] : null;
    return cycle[(idx + 1) % cycle.length];
  }

  var handlers = {
    onTick: function (opId, dateIso, nextCode) {
      if (!state.doc) return;
      var settings = state.doc.settings || {};
      var cycle = codeRows(settings).map(function (c) { return c.key; });
      cycle.push(null);
      var current = codeAt(state.doc, opId, dateIso);
      var code = nextCode === undefined ? nextInCycle(cycle, current) : nextCode;
      var change = { d: dateIso, op: opId, c: code === undefined ? null : code };

      OM.storage.applyChanges(state.doc, [change]);
      persistDocLocally();

      state.queue = state.queue.filter(function (ch) {
        return !(ch.d === change.d && ch.op === change.op);
      });
      state.queue.push(change);
      persistQueue();

      setSync("dirty", SYNC_MESSAGES.dirty);
      scheduleFlush(DEFAULTS.debounceMs);
      render();
    },

    onConfigChange: function (path, value) {
      if (typeof path !== "string") return;
      var local = applyLocalConfig(path, value);
      if (local === "reinit") {
        initStorage().then(pull);
        return;
      }
      if (local === "render") { render(); return; }
      if (!state.doc) return;
      if (setPath(state.doc, path, value)) {
        markConfigDirty();
        render();
      }
    },

    onImport: function (file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try {
          parsed = JSON.parse(String(reader.result));
        } catch (e) {
          state.importWarnings = [{ code: "parse", message: "That file is not valid JSON." }];
          render();
          return;
        }
        var result = engineCall(function () { return OM.engine.migrate(parsed); }, null);
        if (!result) return;
        state.importWarnings = result.warnings || [];
        state.doc = result.doc;
        state.queue = [];
        persistQueue();
        persistDocLocally();
        if (!state.adapter) {
          state.configDirty = true;
          setSync("dirty", SYNC_MESSAGES.dirty);
          render();
          return;
        }
        setSync("syncing", SYNC_MESSAGES.syncing);
        render();
        state.adapter.bulkImport(state.doc).then(function () {
          setSync("synced", SYNC_MESSAGES.synced);
          render();
        }, function (e) {
          reportError(e);
          render();
        });
      };
      reader.onerror = function () {
        state.importWarnings = [{ code: "read", message: "That file could not be read." }];
        render();
      };
      reader.readAsText(file);
    },

    onExport: function () {
      var link = byId("omx-app-export");
      if (!link || !state.adapter) return;
      state.adapter.exportJson().then(function (json) {
        var payload = json && json !== "null" ? json : JSON.stringify(state.doc, null, 2);
        if (state.exportUrl) {
          try { URL.revokeObjectURL(state.exportUrl); } catch (e) { /* ignore */ }
        }
        state.exportUrl = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
        link.href = state.exportUrl;
        link.download = "ops-matrix-" + todayIso() + ".json";
        state.exportPrimed = true;
        link.click();
        state.exportPrimed = false;
      });
    },

    onPatSave: function (token) {
      var t = String(token || "").trim();
      if (t) lsSet(KEYS.PAT, t); else lsRemove(KEYS.PAT);
      initStorage().then(function () {
        return pull();
      });
    },

    onPatTest: function () {
      if (!state.adapter) return;
      setSync("syncing", "Testing the connection");
      render();
      state.adapter.readAll().then(function (res) {
        if (res && res.meta && res.meta.source === "github") {
          setSync("synced", "Token works - connected to the data repo");
        } else {
          setSync("token-needed", "No remote connection - check the token and repo fields");
        }
        render();
      }, function (e) {
        reportError(e);
        render();
      });
    },

    onViewSwitch: function (name) {
      if (VIEW_NAMES.indexOf(name) === -1) return;
      state.view = name;
      lsSet(KEYS.VIEW, name);
      render();
    },

    onDateChange: function (dateIso) {
      state.focusDate = dateIso;
      render();
    },

    onSyncNow: function () {
      pull().then(function () { return flush(); });
    },

    onAddOp: function (categoryId, name) {
      if (!state.doc || !name) return;
      var cats = state.doc.categories || [];
      for (var i = 0; i < cats.length; i++) {
        if (cats[i].id !== categoryId) continue;
        var slots = cats[i].slots || (cats[i].slots = []);
        var opId = categoryId + ":" + slots.length;
        var guard = 0;
        while (opsById(state.doc)[opId] && guard < 1000) {
          guard += 1;
          opId = categoryId + ":" + (slots.length + guard);
        }
        state.doc.ops.push({ id: opId, name: String(name), excluded: false });
        slots.push(opId);
        markConfigDirty();
        render();
        return;
      }
    },

    onAddCategory: function (name, startedOnIso) {
      if (!state.doc || !name) return;
      var base = String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      if (!base) base = "category";
      var id = base, guard = 1;
      var cats = state.doc.categories || (state.doc.categories = []);
      var taken = {};
      for (var i = 0; i < cats.length; i++) taken[cats[i].id] = true;
      while (taken[id] && guard < 1000) { id = base + "-" + guard; guard += 1; }
      cats.push({
        id: id,
        name: String(name),
        startedOn: startedOnIso || todayIso(),
        slots: [],
        order: cats.length + 1
      });
      markConfigDirty();
      render();
    },

    // SETTINGS ONLY - rewrites categories[].order to 1..n in the new visual sequence.
    onReorderCategories: function (orderedCategoryIds) {
      if (!state.doc || !Array.isArray(orderedCategoryIds)) return;
      var cats = state.doc.categories || [];
      var placed = {};
      var seq = 0, i, j;
      for (i = 0; i < orderedCategoryIds.length; i++) {
        var id = orderedCategoryIds[i];
        if (placed[id]) continue;
        for (j = 0; j < cats.length; j++) {
          if (cats[j].id !== id) continue;
          seq += 1;
          cats[j].order = seq;
          placed[id] = true;
          break;
        }
      }
      for (i = 0; i < cats.length; i++) {
        if (placed[cats[i].id]) continue;
        seq += 1;
        cats[i].order = seq;
      }
      markConfigDirty();
      render();
    },

    // SETTINGS ONLY - permutes doc.ops (INTERFACES.md section 4.3). The category's items are
    // written back into the same doc.ops index positions they already occupied, so no other
    // category moves. categories[].slots is never touched.
    onReorderOps: function (categoryId, orderedOpIds) {
      if (!state.doc || !Array.isArray(orderedOpIds)) return;
      var cats = state.doc.categories || [];
      var ops = state.doc.ops || [];
      var cat = null, i;
      for (i = 0; i < cats.length; i++) { if (cats[i].id === categoryId) { cat = cats[i]; break; } }
      if (!cat) return;

      var member = {};
      var slots = cat.slots || [];
      for (i = 0; i < slots.length; i++) member[slots[i]] = true;

      var positions = [];
      var byOpId = {};
      for (i = 0; i < ops.length; i++) {
        if (!ops[i] || !ops[i].id) continue;
        byOpId[ops[i].id] = ops[i];
        if (member[ops[i].id]) positions.push(i);
      }

      var used = {};
      var seq = [];
      for (i = 0; i < orderedOpIds.length; i++) {
        var candidate = byOpId[orderedOpIds[i]];
        if (!candidate || used[candidate.id] || !member[candidate.id]) continue;
        used[candidate.id] = true;
        seq.push(candidate);
      }
      for (i = 0; i < positions.length; i++) {
        var existing = ops[positions[i]];
        if (!existing || used[existing.id]) continue;
        used[existing.id] = true;
        seq.push(existing);
      }
      if (seq.length !== positions.length) return;

      for (i = 0; i < positions.length; i++) ops[positions[i]] = seq[i];
      markConfigDirty();
      render();
    }
  };

  // -----------------------------------------------------------------------
  // Settings panel - app.js builds the whole DOM (INTERFACES.md section 7.5)
  // -----------------------------------------------------------------------

  function field(labelText, input) {
    var wrap = el("label", { className: "omx-app-field" });
    wrap.appendChild(el("span", { className: "omx-app-field-label", text: labelText }));
    wrap.appendChild(input);
    return wrap;
  }

  function textInput(value, onChange) {
    var input = document.createElement("input");
    input.type = "text";
    input.value = value === undefined || value === null ? "" : String(value);
    input.addEventListener("change", function () { onChange(input.value); });
    return input;
  }

  function passwordInput() {
    var input = document.createElement("input");
    input.type = "password";
    input.autocomplete = "off";
    input.spellcheck = false;
    return input;
  }

  function numberInput(value, onChange) {
    var input = document.createElement("input");
    input.type = "number";
    input.value = isNum(value) ? String(value) : "";
    input.addEventListener("change", function () { onChange(Number(input.value)); });
    return input;
  }

  function checkboxInput(checked, onChange) {
    var input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!checked;
    input.addEventListener("change", function () { onChange(input.checked); });
    return input;
  }

  function selectInput(options, onChange) {
    var input = document.createElement("select");
    for (var i = 0; i < options.length; i++) {
      var opt = document.createElement("option");
      opt.value = options[i][0];
      opt.textContent = options[i][1];
      input.appendChild(opt);
    }
    input.addEventListener("change", function () { onChange(input.value); });
    return input;
  }

  function plainButton(text, onClick) {
    var node = el("button", { className: "omx-app-btn", text: text, attrs: { type: "button" } });
    node.addEventListener("click", onClick);
    return node;
  }

  function primaryButton(text, onClick) {
    var node = el("button", {
      className: "omx-app-btn omx-app-btn-primary", text: text, attrs: { type: "button" }
    });
    node.addEventListener("click", onClick);
    return node;
  }

  function dangerButton(text, onClick) {
    var node = el("button", {
      className: "omx-app-btn omx-app-btn-danger", text: text, attrs: { type: "button" }
    });
    node.addEventListener("click", onClick);
    return node;
  }

  function actionsRow() {
    return el("div", { className: "omx-app-actions" });
  }

  function helpText(text) {
    return el("p", { className: "omx-app-help-text", text: text });
  }

  function settingsCard(sectionName, titleText, wide) {
    var card = wide
      ? el("section", {
        className: "omx-app-settings-card omx-app-settings-card-wide",
        attrs: { "data-settings-section": sectionName }
      })
      : el("section", {
        className: "omx-app-settings-card",
        attrs: { "data-settings-section": sectionName }

  function categoryRowsInOrder() {
    var cats = state.doc.categories || [];
    var rows = [];
    for (var i = 0; i < cats.length; i++) rows.push({ cat: cats[i], index: i });
    rows.sort(function (a, b) {
      var ao = isNum(a.cat.order) ? a.cat.order : a.index + 1;
      var bo = isNum(b.cat.order) ? b.cat.order : b.index + 1;
      if (ao !== bo) return ao - bo;
      return a.index - b.index;
    });
    return rows;
  }

  function buildCategoryRow(cat, catIndex, ops) {

    });

      attrs: { type: "button", "aria-label": "Reorder " + cat.name }
    }));

    var fields = el("div", { className: "omx-app-field-row" });

    })));
    fields.appendChild(field("Started on", textInput(cat.startedOn, function (v) {
      handlers.onConfigChange("categories[" + catIndex + "].startedOn", v);
    })));
    body.appendChild(fields);

    var list = el("div", {
      className: "omx-app-dnd-list", attrs: { "data-dnd-scope": "op" }
    });
    var member = {};
    var slots = cat.slots || [];
    var i;
    for (i = 0; i < slots.length; i++) member[slots[i]] = true;
    for (i = 0; i < ops.length; i++) {
      if (!ops[i] || !member[ops[i].id]) continue;
      list.appendChild(buildOpRow(ops[i], i));
    }
    body.appendChild(list);

    var actions = actionsRow();

    nameBox.type = "text";
    nameBox.className = "omx-app-new-op-name";

    actions.appendChild(nameBox);
    actions.appendChild(plainButton("Add item", function () {
