  function renderCategories() {
    var host = sref.categories;
    if (!host) return;
    host.textContent = "";
    dndNames = {};
    var ops = state.doc.ops || [];
    var rows = categoryRowsInOrder();
    for (var i = 0; i < rows.length; i++) {
      host.appendChild(buildCategoryRow(rows[i].cat, rows[i].index, ops));
    }
    restoreDndFocus();
  }

  function restoreDndFocus() {
    var wanted = state.settingsFocusId;
    state.settingsFocusId = null;
    if (!wanted || !sref.categories) return;
    var rows = sref.categories.querySelectorAll(".omx-app-dnd-row");
    for (var i = 0; i < rows.length; i++) {
      var id = rows[i].getAttribute("data-category-id") || rows[i].getAttribute("data-op-id");
      if (id !== wanted) continue;
      var handle = rows[i].querySelector(".omx-app-dnd-handle");
      if (handle && handle.focus) handle.focus();
      return;
    }
  }

  // --- drag and drop machinery -------------------------------------------

  function dndRowsOf(list) {
    var out = [];
    if (!list) return out;
    var kids = list.children;
    for (var i = 0; i < kids.length; i++) {
      if (!kids[i].getAttribute) continue;
      if (!kids[i].getAttribute("data-dnd-scope")) continue;
      out.push(kids[i]);
    }
    return out;
  }

  function dndIdOf(row) {
    if (!row || !row.getAttribute) return null;
    return row.getAttribute("data-dnd-scope") === "category"
      ? row.getAttribute("data-category-id")
      : row.getAttribute("data-op-id");
  }

  function dndIdsOf(list) {
    var rows = dndRowsOf(list);
    var ids = [];
    for (var i = 0; i < rows.length; i++) ids.push(dndIdOf(rows[i]));
    return ids;
  }

  function dndIdsWithIndicator() {
    var ids = [];
    var kids = dnd.list.children;
    var placed = false;
    for (var i = 0; i < kids.length; i++) {
      var node = kids[i];
      if (node === dnd.indicator) { ids.push(dnd.rowId); placed = true; continue; }
      if (node === dnd.row) continue;
      if (!node.getAttribute || !node.getAttribute("data-dnd-scope")) continue;
      ids.push(dndIdOf(node));
    }
    if (!placed) ids.push(dnd.rowId);
    return ids;
  }

  function sameIds(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }

  function dndAnnounce(message) {
    if (sref.dndStatus) sref.dndStatus.textContent = message;
  }

  function dndPositionMessage(verb) {
    var rows = dnd.mode === "pointer" ? dndIdsWithIndicator() : dndIdsOf(dnd.list);
    var at = rows.indexOf(dnd.rowId) + 1;
    return dnd.rowName + verb + String(at) + " of " + String(rows.length);
  }

  function dndDetachIndicator() {
    if (!dnd.indicator) return;
    dnd.indicator.hidden = true;
    if (sref.categoriesCard && sref.dndStatus && dnd.indicator.parentNode !== sref.categoriesCard) {
      sref.categoriesCard.insertBefore(dnd.indicator, sref.dndStatus);
    }
  }

  function dndPlaceIndicator(target, after) {
    if (!dnd.indicator || !dnd.list) return;
    dnd.indicator.hidden = false;
    if (after) dnd.list.insertBefore(dnd.indicator, target.nextSibling);
    else dnd.list.insertBefore(dnd.indicator, target);
  }

  function dndStart(row, mode) {
    var list = row.parentNode;
    dnd.active = true;
    dnd.mode = mode;
    dnd.scope = row.getAttribute("data-dnd-scope");
    dnd.row = row;
    dnd.rowId = dndIdOf(row);
    dnd.rowName = dndNames[dnd.rowId] || "";
    dnd.list = list;
    dnd.startNext = row.nextSibling;
    dnd.startIds = dndIdsOf(list);
    if (mode === "pointer") {
      row.setAttribute("data-dragging", "true");
      dndPlaceIndicator(row, false);
    } else {
      row.setAttribute("data-lifted", "true");
    }
  }

  function dndClear() {
    if (dnd.row) {
      dnd.row.removeAttribute("data-dragging");
      dnd.row.removeAttribute("data-lifted");
    }
    dndDetachIndicator();
    dnd.active = false;
    dnd.mode = null;
    dnd.scope = null;
    dnd.row = null;
    dnd.rowId = null;
    dnd.rowName = "";
    dnd.list = null;
    dnd.startNext = null;
    dnd.startIds = null;
    dnd.pointerId = null;
    dnd.handle = null;
  }

  function dndCancel() {
    if (!dnd.active) return;
    if (dnd.mode === "keyboard" && dnd.row && dnd.list) {
      dnd.list.insertBefore(dnd.row, dnd.startNext);
      dndRefocusHandle();
    }
    dndAnnounce(dnd.rowName + " reorder cancelled");
    dndClear();
  }

  function dndCommit() {
    if (!dnd.active) return;
    var ids = dnd.mode === "pointer" ? dndIdsWithIndicator() : dndIdsOf(dnd.list);
    var scope = dnd.scope;
    var list = dnd.list;
    var rowId = dnd.rowId;
    var unchanged = sameIds(ids, dnd.startIds);
    dndAnnounce(dndPositionMessage(" dropped, position "));
    dndClear();
    if (unchanged) { render(); return; }
    state.settingsFocusId = rowId;
    if (scope === "category") {
      handlers.onReorderCategories(ids);
      return;
    }
    var owner = list && list.closest ? list.closest(".omx-app-dnd-row") : null;
    var categoryId = owner ? owner.getAttribute("data-category-id") : null;
    if (categoryId) handlers.onReorderOps(categoryId, ids);
    else render();
  }

  // Moving a row re-inserts it, which drops focus off the handle inside it. Without this the
  // second ArrowDown of a keyboard reorder would never reach the list's keydown handler.
  function dndRefocusHandle() {
    if (dnd.handle && dnd.handle.focus) dnd.handle.focus();
  }

  function dndKeyboardMove(delta) {
    if (!dnd.active || dnd.mode !== "keyboard") return;
    var rows = dndRowsOf(dnd.list);
    var idx = rows.indexOf(dnd.row);
    var next = idx + delta;
    if (idx === -1 || next < 0 || next >= rows.length) return;
    if (delta < 0) dnd.list.insertBefore(dnd.row, rows[next]);
    else dnd.list.insertBefore(dnd.row, rows[next].nextSibling);
    dndRefocusHandle();
    dndAnnounce(dndPositionMessage(", position "));
  }

  function wireDragAndDrop(list) {
    list.addEventListener("pointerdown", function (evt) {
      if (dnd.active) return;
      var handle = evt.target && evt.target.closest ? evt.target.closest(".omx-app-dnd-handle") : null;
      if (!handle) return;
      var row = handle.closest(".omx-app-dnd-row");
      if (!row || !row.parentNode) return;
      evt.preventDefault();
      dndStart(row, "pointer");
      dnd.handle = handle;
      dnd.pointerId = evt.pointerId;
      try { handle.setPointerCapture(evt.pointerId); } catch (e) { /* no capture, still fine */ }
      dndAnnounce(dndPositionMessage(" lifted, position "));
    });

    list.addEventListener("pointermove", function (evt) {
      if (!dnd.active || dnd.mode !== "pointer") return;
      var under = document.elementFromPoint ? document.elementFromPoint(evt.clientX, evt.clientY) : null;
      var row = under && under.closest ? under.closest(".omx-app-dnd-row") : null;
      if (!row || row === dnd.row) return;
      if (row.parentNode !== dnd.list) return;
      if (row.getAttribute("data-dnd-scope") !== dnd.scope) return;
      var box = row.getBoundingClientRect();
      dndPlaceIndicator(row, evt.clientY > box.top + box.height / 2);
    });

    list.addEventListener("pointerup", function () {
      if (!dnd.active || dnd.mode !== "pointer") return;
      releasePointer();
      dndCommit();
    });

    list.addEventListener("pointercancel", function () {
      if (!dnd.active || dnd.mode !== "pointer") return;
      releasePointer();
      dndCancel();
      render();
    });

    list.addEventListener("keydown", function (evt) {
      var handle = evt.target && evt.target.closest ? evt.target.closest(".omx-app-dnd-handle") : null;
      if (!handle) return;
      var key = evt.key;
      if (key === " " || key === "Spacebar" || key === "Enter") {
        evt.preventDefault();
        if (!dnd.active) {
          var row = handle.closest(".omx-app-dnd-row");
          if (!row || !row.parentNode) return;
          dndStart(row, "keyboard");
          dnd.handle = handle;
          dndAnnounce(dndPositionMessage(" lifted, position "));
        } else {
          dndCommit();
        }
        return;
      }
      if (key === "ArrowUp") { evt.preventDefault(); dndKeyboardMove(-1); return; }
      if (key === "ArrowDown") { evt.preventDefault(); dndKeyboardMove(1); return; }
      if (key === "Escape" && dnd.active) { evt.preventDefault(); dndCancel(); render(); }
    });
  }

  function releasePointer() {
    if (dnd.handle && dnd.pointerId !== null && dnd.handle.releasePointerCapture) {
      try { dnd.handle.releasePointerCapture(dnd.pointerId); } catch (e) { /* ignore */ }
    }
  }

  // --- panel assembly -----------------------------------------------------

  function buildSettings(host) {
    var grid = el("div", { className: "omx-app-settings-grid" });
    grid.appendChild(buildConnectionCard());
    grid.appendChild(buildScoringCard());
    grid.appendChild(buildTrailsCard());
    grid.appendChild(buildCodesCard());
    grid.appendChild(buildDisplayCard());
    grid.appendChild(buildDataCard());
    grid.appendChild(buildCategoriesCard());
    host.appendChild(grid);
  }

  function syncStaticSettingsInputs() {
    var s = state.doc.settings || {};
    var pairs = [
      [sref.repoOwner, lsGet(KEYS.REPO_OWNER, DEFAULTS.repoOwner)],
      [sref.repoName, lsGet(KEYS.REPO_NAME, DEFAULTS.repoName)],
      [sref.repoPath, lsGet(KEYS.REPO_PATH, DEFAULTS.repoPath)],
      [sref.repoBranch, lsGet(KEYS.REPO_BRANCH, DEFAULTS.repoBranch)],
      [sref.target, (s.scoring && s.scoring.target) !== undefined ? s.scoring.target : ""],
      [sref.timezone, s.timezone || ""],
      [sref.dateFormat, s.dateFormat || ""],
      [sref.lastNDays, (s.dashboard && s.dashboard.lastNDays) !== undefined ? s.dashboard.lastNDays : ""],
      [sref.gridDays, state.gridDays],
      [sref.viewMode, state.viewMode]
    ];
    for (var i = 0; i < pairs.length; i++) {
      var node = pairs[i][0];
      if (node && document.activeElement !== node) node.value = String(pairs[i][1]);
    }
  }

  function renderSettings() {
    if (!state.doc) return;
    var host = byId(VIEW_CONTAINERS.settings);
    if (!host) return;
    if (!state.settingsBuilt) {
      host.textContent = "";
      buildSettings(host);
      state.settingsBuilt = true;
    }
    syncStaticSettingsInputs();
    renderBands();
    renderTrails();
    renderCodes();
    renderCategories();
    renderImportWarnings();
  }

  // -----------------------------------------------------------------------
  // Rendering
  // -----------------------------------------------------------------------

  function applyViewMode() {
    var root = byId("omx-app");
    if (root) root.setAttribute("data-viewmode", state.viewMode);
  }

  function autoView() {
    if (state.viewMode === "desktop") return "grid";
    if (state.viewMode === "mobile") return "mobile";
    var small = false;
    try {
      small = window.matchMedia(DEFAULTS.mobileQuery).matches;
    } catch (e) { /* no matchMedia: stay desktop */ }
    return small ? "mobile" : "grid";
  }

  function render() {
    if (typeof document === "undefined") return;
    if (dnd.active) return;
    var root = byId("omx-app");
    if (!root || !state.doc) { paintPill(); return; }

    root.setAttribute("data-view", state.view);
    applyViewMode();

    var derived = buildDerived();
    var model = deepFreeze(clone(state.doc));

    var name;
    for (name in VIEW_CONTAINERS) {
      if (!hasOwn(VIEW_CONTAINERS, name)) continue;
      var node = byId(VIEW_CONTAINERS[name]);
      if (node) node.hidden = name !== state.view;
    }

    var nav = byId("omx-nav");
    if (nav) {
      var btns = nav.querySelectorAll("[data-view-btn]");
      for (var i = 0; i < btns.length; i++) {
        btns[i].setAttribute("data-active", btns[i].getAttribute("data-view-btn") === state.view ? "true" : "false");
      }
    }

    if (state.view === "settings") {
      renderSettings();
    } else {
      var container = byId(VIEW_CONTAINERS[state.view]);
      var view = OM.views[state.view];
      if (container && view && typeof view.render === "function") {
        var left = container.scrollLeft;
        var top = container.scrollTop;
        try {
          view.render(container, model, derived, handlers);
        } catch (e) {
          container.textContent = "";
          container.appendChild(el("div", {
            className: "omx-app-view-error",
            text: "This view could not be drawn: " + (e && e.message ? e.message : String(e))
          }));
        }
        container.scrollLeft = left;
        container.scrollTop = top;
      }
    }

    paintPill();
  }

  // -----------------------------------------------------------------------
  // Wiring
  // -----------------------------------------------------------------------

  function wireShell() {
    var nav = byId("omx-nav");
    if (nav) {
      nav.addEventListener("click", function (evt) {
        var btn = evt.target && evt.target.closest ? evt.target.closest("[data-view-btn]") : null;
        if (!btn) return;
        handlers.onViewSwitch(btn.getAttribute("data-view-btn"));
      });
    }

    var pill = byId("omx-sync-banner");
    if (pill) {
      var tokenBtn = pill.querySelector(".omx-app-sync-token-btn");
      if (tokenBtn) tokenBtn.addEventListener("click", function () { handlers.onViewSwitch("settings"); });
      pill.addEventListener("dblclick", function () { handlers.onSyncNow(); });
    }
  }

  function wireLifecycle() {
    window.addEventListener("focus", function () { pull(); });

    if (typeof document !== "undefined") {
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") {
          if (state.flushTimer) { clearTimeout(state.flushTimer); state.flushTimer = null; }
          flush();
        } else {
          pull();
        }
      });
      document.addEventListener("keydown", function (evt) {
        if (dnd.active && dnd.mode === "pointer" && evt.key === "Escape") {
          releasePointer();
          dndCancel();
          render();
        }
      });
    }

    window.addEventListener("beforeunload", function () {
      if (state.flushTimer) { clearTimeout(state.flushTimer); state.flushTimer = null; }
      flush();
    });

    window.addEventListener("online", function () { pull(); });
    window.addEventListener("offline", function () { setSync("offline", SYNC_MESSAGES.offline); render(); });

    try {
      var mq = window.matchMedia(DEFAULTS.mobileQuery);
      var onChange = function () {
        if (state.viewMode !== "auto") return;
        if (state.view !== "grid" && state.view !== "mobile") return;
        var next = autoView();
        if (next !== state.view) { state.view = next; lsSet(KEYS.VIEW, next); render(); }
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    } catch (e) { /* no matchMedia */ }
  }

  function boot() {
    if (state.booted) return Promise.resolve();
    state.booted = true;

    state.viewMode = lsGet(KEYS.VIEWMODE, DEFAULTS.viewMode);
    state.gridDays = Math.max(1, Math.trunc(Number(lsGet(KEYS.GRID_DAYS, DEFAULTS.gridDays)) || DEFAULTS.gridDays));
    var storedView = lsGet(KEYS.VIEW, "");
    state.view = storedView && VIEW_CONTAINERS[storedView] ? storedView : autoView();
    loadQueue();

    // Draw from the cache immediately so the tick surface is usable before the network lands.
    adoptDoc(cachedDoc());
    if (state.queue.length) setSync("dirty", SYNC_MESSAGES.dirty);

    wireShell();
    wireLifecycle();
    render();

    return initStorage().then(function () {
      return pull();
    }).catch(function (e) {
      reportError(e);
      render();
    });
  }

  OM.app = {
    boot: boot,
    handlers: handlers,
    state: state,
    buildDerived: buildDerived,
    todayIso: todayIso,
    flush: flush,
    pull: pull,
    render: render,
    VERSION: "2.0.0"
  };

  if (typeof document !== "undefined" && typeof document.addEventListener === "function") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { boot(); });
    } else {
      boot();
    }
  }
})();
</script>
</body>
</html>
